   * `overflow` is attached to the LIST, not to the wrapper: overlays are positioned relative to the wrapper
   * (`inset: 0`), and clipping on it would cut off the expansion window. */
  min-height: 0;
  overflow-y: auto;
}

/* A list row is a button: number, text, arrow. The vertical margins are minimal — on 14
 * of items every extra pixel of a row is multiplied by seven.
 *
 * WARNING: the actual vertical padding is set NOT by this rule but by the list height budget block
 * at the end of the file: it overrides `padding` unconditionally. Make density changes there. */
.dx-list .dx-ls-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: baseline;
  gap: 0 10px;
  text-align: left;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--deck-line);
  border-radius: 0;
  padding: 5px 6px 5px 2px;
  cursor: pointer;
  transition: background 120ms var(--deck-motion-ease, ease);
}

.dx-list .dx-ls-row:hover {
  background: var(--deck-surface-2);
}

.dx-list .dx-ls-n {
  font: 700 15px/1.35 var(--deck-font-display);
  color: var(--deck-accent);
  min-width: 20px;
}

.dx-list .dx-ls-text {
  display: block;
  min-width: 0;
}

.dx-list .dx-ls-title {
  display: block;
  font: 500 17px/1.2 var(--deck-font-text);
  color: var(--deck-text);
}

/* The teaser goes on a separate line under the bullet and in a small font size: on one line with the heading it
 * would eat the width from the bullet itself, and the bullet is what the presenter reads aloud. */
.dx-list .dx-ls-teaser {
  white-space: pre-line;
  display: block;
  font: 400 13px/1.18 var(--deck-font-text);
  color: var(--deck-muted);
}

.dx-list .dx-ls-more {
  font: 500 15px/1.3 var(--deck-font-text);
  color: var(--deck-accent);
  opacity: 0.55;
}

.dx-list .dx-ls-row:hover .dx-ls-more {
  opacity: 1;
}

.dx-list .dx-ls-takeaway {
  font: 500 16px/1.3 var(--deck-font-text);
  color: var(--deck-text);
  margin: 0;
  padding-top: 8px;
  border-top: 1.5px solid var(--deck-line);
}

/* ── footer with the promo block ─────────────────────────────────────────────────
 * Appears only when the slide has an `image` with `src`. The takeaway stays the same paragraph
 * with the same line on top: the footer merely places a second column next to it. The line then
 * stretches across the full width, so `border-top` moves to the footer itself and is removed from the takeaway
 * otherwise there would be two lines of different lengths. */
.dx-list .dx-ls-foot {
  display: flex;
  align-items: center;
  gap: 20px;
  padding-top: 8px;
  /* The right padding is reserved for the logo watermark in the canvas corner: it is drawn over the slide content,
   * and a promo block caption stretched to the edge of the content box ends up right under it. */
  padding-right: 46px;
  border-top: 1.5px solid var(--deck-line);
}

.dx-list .dx-ls-foot .dx-ls-takeaway {
  flex: 1 1 auto;
  min-width: 0;
  padding-top: 0;
  border-top: 0;
}

.dx-list .dx-ls-promo {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* The QR side is a compromise between scannable from the viewer screen and does not eat the list.
 * 104 px of canvas at a 1920 frame is about 166 physical pixels, so a version 3 module (29×29)
 * comes out larger than five pixels and is readable by a phone camera at arm length. */
.dx-list .dx-ls-promo-qr {
  width: 104px;
  height: 104px;
  flex: 0 0 auto;
  padding: 6px;
  border: 1.5px solid var(--deck-line);
  border-radius: 10px;
  background: var(--deck-surface);
  display: flex;
  align-items: center;
  justify-content: center;
}

.dx-list .dx-ls-promo-qr .deck-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* The caption does NOT wrap: monospaced 13px gives about 28 characters per line, and a second line immediately
 * hits the edge. The 60-character ceiling of `imageNote` is therefore not how much fits but how much
 * fits in two lines at 200px, so keep it to one line. */
.dx-list .dx-ls-promo-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-width: 250px;
}

.dx-list .dx-ls-promo-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font: 700 17px/1.2 var(--deck-font-display);
  color: var(--deck-text);
}

.dx-list .dx-ls-promo-icon {
  width: 19px;
  height: 19px;
  flex: 0 0 auto;
  color: var(--deck-accent);
}

.dx-list .dx-ls-promo-note {
  font: 400 13px/1.3 var(--deck-font-mono);
  color: var(--deck-muted);
}

/* ── overlay ────────────────────────────────────────────────────────────────────
 * The window mechanism is carried over from dx-popup verbatim: the expansion panel of the frame
 * (`.deck-island-panel`) is display:none by default, so the content stays in the markup
 * for print and text exports, but is not visible. It is expanded by the marker `deck-island-open`
 * on the PARENT — the frame selector `.deck-island-open > .deck-island-panel`. */
.dx-list .dx-ls-panel {
  position: absolute;
  inset: 0;
  z-index: 5;
}

.dx-list .dx-ls-modal.deck-island-open > .dx-ls-panel {
  display: block;
}

/* The dimming extends beyond the island wrapper to cover the slide margins, but horizontally exactly
 * by the side padding of `.dx-list` (34px) — not a pixel more, otherwise scrollWidth goes beyond the
 * canvas edge and qa-scan catches it as an overflow. */
.dx-list .dx-ls-scrim {
  position: absolute;
  inset: -40px -34px;
  background: var(--deck-bg);
  opacity: 0.86;
  cursor: pointer;
}

/* The open window is modal: reading the list under it is not intended. We dim it explicitly, otherwise the
 * list row ↔ window text overlap remains a real text overlap in the measurement
 * of qa-scan, although by eye it is not one. */
.dx-list .dx-ls-wrap:has(.dx-ls-modal.deck-island-open) .dx-ls-items {
  visibility: hidden;
}

.dx-list .dx-ls-win {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 900px;
  max-width: 100%;
  max-height: 560px;
  display: flex;
  flex-direction: column;
  background: var(--deck-surface);
  border: 2px solid var(--deck-accent);
  border-radius: 14px;
  box-shadow: 0 18px 48px var(--deck-term-shadow);
  overflow: hidden;
}

.dx-list .dx-ls-win-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 18px;
  border-bottom: 1.5px solid var(--deck-line);
  background: var(--deck-accent-soft);
  flex: 0 0 auto;
}

.dx-list .dx-ls-win-title {
  font: 700 21px/1.25 var(--deck-font-display);
  color: var(--deck-text);
}

.dx-list .dx-ls-close {
  font: 400 26px/1 var(--deck-font-display);
  color: var(--deck-muted);
  background: transparent;
  border: 1.5px solid var(--deck-line);
  border-radius: 8px;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  cursor: pointer;
}

.dx-list .dx-ls-close:hover {
  color: var(--deck-text);
  border-color: var(--deck-accent);
}

/* The only scrollable zone of the type. The scroll lives here, not on the whole window, so that
 * the header with the cross stays in place: otherwise on a long text the close button moves away. */
.dx-list .dx-ls-win-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 20px;
  font: 400 15px/1.55 var(--deck-font-text);
  color: var(--deck-text);
}

.dx-list .dx-ls-win-body p {
  margin: 0 0 10px;
}

.dx-list .dx-ls-win-body p:last-child {
  margin-bottom: 0;
}

.dx-list .dx-ls-win-body ul,
.dx-list .dx-ls-win-body ol {
  margin: 0 0 10px;
  padding-left: 20px;
}

.dx-list .dx-ls-win-body li {
  margin: 0 0 5px;
}

.dx-list .dx-ls-win-body code {
  font-family: var(--deck-font-mono, var(--deck-font-text));
  background: var(--deck-surface-2);
  border-radius: 4px;
  padding: 1px 5px;
}

.dx-list .dx-ls-win-src {
  flex: 0 0 auto;
  padding: 8px 20px;
  font: 400 13px/1.35 var(--deck-font-text);
  color: var(--deck-muted);
  border-top: 1.5px solid var(--deck-line);
}

.dx-list .dx-ls-win-hint {
  flex: 0 0 auto;
  padding: 6px 20px 10px;
  font: 400 12px/1.2 var(--deck-font-text);
  color: var(--deck-muted);
  text-align: right;
}

/* ── More mixin: buttons, links and panels with embedded guides ──────────────── */

/* THE STRIP MUST STAY SINGLE-LINE. This is not aesthetics: a second line costs another ~30 px,
 * and dense screens have none to spare (see the height budget below: at 14 items the button
 * covered the slide takeaway even AFTER the rows were compacted). Wrapping is forbidden here, and the caption
 * ceilings are held by the type schema (28 characters per button, 34 per link, four elements per strip).
 *
 * `overflow: hidden` is the second line of defense in case the captions still did not fit: then the
 * content is clipped at the edge of the strip rather than spilling out of the canvas and dragging
 * horizontal scrolling of the slide along. A clipped caption is visible to the eye, a displaced canvas is not. */
.dx-list .dx-ls-guidebar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-top: 4px;
  flex: 0 0 auto;
  flex-wrap: nowrap;
  overflow: hidden;
}

/* The button does not shrink (`flex: 0 0 auto`): the caption on it is the artifact address, and truncating it
 * with an ellipsis would make the button indistinguishable from its neighbor. The links shrink, they are below. */
.dx-list .dx-ls-guide-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: 500 15px/1.2 var(--deck-font-text);
  color: var(--deck-text);
  background: var(--deck-accent-soft);
  border: 1.5px solid var(--deck-accent);
  border-radius: 999px;
  padding: 5px 16px;
  cursor: pointer;
  flex: 0 0 auto;
  white-space: nowrap;
}

.dx-list .dx-ls-guide-btn:hover { background: var(--deck-surface-2); }

.dx-list .dx-ls-guide-ico { font-size: 13px; color: var(--deck-accent); }

.dx-list .dx-ls-guide-link {
  font: 400 13px/1.2 var(--deck-font-text);
  color: var(--deck-muted);
  text-decoration: underline;
  flex: 0 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── list height budget ────────────────────────────────────────────────────────
 *
 * The rows do NOT shrink by themselves. `.dx-ls-items` is a grid inside a flex column, and a flex item
 * has `min-height` `auto` by default — it cannot shrink below its content. So everything that
 * did not fit spills DOWN out of the wrapper and lies on the `takeaway`, which comes next
 * in the slide flow. There is neither a canvas overflow nor a scroll: the screen looks intact,
 * and the slide conclusion is covered by bullets. This is exactly how it showed up.
 *
 * Keeping the conclusion readable matters more than density: `takeaway` stays the only text of the screen
 * when interactivity is lost — print, PPTX, a dead mouse on a borrowed laptop.
 *
 * Measurement (canvas 1200×675, style `hss-aidev`, `m-observe`): 14 items in two columns is 7 rows,
 * a row with a two-line heading 71.6 px, 481 in total with a wrapper of 483. The More strip asks
 * for another 43. After the `teaser` rule of 70–90 characters the teaser also goes to the second line, and the row grows
 * further — that is why the slides drifted even WITHOUT the guide button.
 *
 * The inter-row margin is cut, NOT the font size and not the teasers: the line loses air but stays the same
 * line, whereas a reduced font is not readable from a projector at all. 54 px are freed
 * (6 px on each of the seven rows + 2 px on each of the six gaps).
 *
 * The rule is UNCONDITIONAL, not `:has(.dx-ls-guidebar)`: the overflow is brought by a long teaser, and it
 * exists on slides without a guide as well (`m-ops`, `m-loop`, `l-build`). One density for all `dx-list`,
 * otherwise two neighboring screens of the same type drift apart in rhythm before the eyes of the room. */
.dx-list .dx-ls-items {
  row-gap: 2px;
}

/* WARNING: 1px, NOT 2px, AND THIS IS A MEASUREMENT, NOT TASTE. At 2px a nine-item screen in one column
 * gave `scrollHeight` 520 against `clientHeight` 512: the last row was clipped by 10 px, that is,
 * the ninth item lost the second line of its teaser. The scroll valve formally worked,
 * but 8 px cannot be grabbed with a mouse and no scrollbar is shown, so from the outside it is exactly no scroll
 * and the item is clipped. Measured on a live deck of 45 screens: ELEVEN screens were like that
 * at once, and no machine gate saw it. `--check-overflow` looks at overflow beyond the canvas,
 * and a list with `overflow-y: auto` does not stick out of the canvas by definition, so this is caught
 * ONLY by measuring `scrollHeight − clientHeight` across all screens in a row.
 * 1px gives 9 rows in 502 px, that is, 10 px of headroom. */
.dx-list .dx-ls-row {
  padding-top: 1px;
  padding-bottom: 1px;
}

/* The More strip asks for another ~36 px on top of this budget, and with 14 items there is nowhere to take them:
 * a measurement on `m-observe` after the general tightening — the button still covered the conclusion by 30 px.
 * Therefore rows on slides WITH a guide lose the remainder of the vertical margin: the separator between
 * items is the line below and a gap of 2 px, and without inner margin the row is readable.
 * The `:has` scope is deliberate — a slide without the button keeps this remainder. */
.dx-list .dx-ls-wrap:has(.dx-ls-guidebar) .dx-ls-row {
  padding-top: 0;
  padding-bottom: 0;
}

/* Everything that dims under the overlay: the list and the strip with the button. Otherwise the overlap of the button ↔ text
 * of the panel remains a real text overlap in the qa-scan measurement, although by eye it is not one. */
.dx-list .dx-ls-wrap:has(.dx-ls-gmodal.deck-island-open) .dx-ls-items,
.dx-list .dx-ls-wrap:has(.dx-ls-gmodal.deck-island-open) .dx-ls-guidebar,
.dx-list .dx-ls-wrap:has(.dx-ls-modal.deck-island-open) .dx-ls-guidebar {
  visibility: hidden;
}

.dx-list .dx-ls-gpanel {
  position: absolute;
  inset: 0;
  /* Above the item windows: the guide opens over everything that is on the screen. */
  z-index: 6;
}

.dx-list .dx-ls-gmodal.deck-island-open > .dx-ls-gpanel { display: block; }

/* The guide window is wider and taller than the item window: inside are a five-column table and code blocks for which
 * 900 px is not enough. The height is chosen by measurement so that the window does not go beyond the canvas edge. */
.dx-list .dx-ls-gwin {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 1108px;
  max-width: 100%;
  height: 556px;
  max-height: 556px;
  display: flex;
  flex-direction: column;
  background: var(--deck-surface);
  border: 2px solid var(--deck-accent);
  border-radius: 14px;
  box-shadow: 0 18px 48px var(--deck-term-shadow);
  overflow: hidden;
}

.dx-list .dx-ls-gclose {
  font: 400 26px/1 var(--deck-font-display);
  color: var(--deck-muted);
  background: transparent;
  border: 1.5px solid var(--deck-line);
  border-radius: 8px;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  cursor: pointer;
}

.dx-list .dx-ls-gclose:hover { color: var(--deck-text); border-color: var(--deck-accent); }

.dx-list .dx-ls-gwin-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 18px 24px;
  font: 400 14px/1.55 var(--deck-font-text);
  color: var(--deck-text);
}

/* ── typography of the embedded Markdown ──────────────────────────────────────── */

.dx-list .dx-md h3 { font: 700 21px/1.25 var(--deck-font-display); color: var(--deck-text); margin: 20px 0 8px; }
.dx-list .dx-md h4 { font: 700 18px/1.25 var(--deck-font-display); color: var(--deck-text); margin: 18px 0 6px; }
.dx-list .dx-md h5 { font: 700 16px/1.25 var(--deck-font-display); color: var(--deck-text); margin: 14px 0 6px; }
.dx-list .dx-md h6 { font: 700 14px/1.25 var(--deck-font-display); color: var(--deck-muted); margin: 12px 0 4px; }
.dx-list .dx-md > h3:first-child,
.dx-list .dx-md > h4:first-child { margin-top: 0; }
.dx-list .dx-md p { margin: 0 0 10px; }
.dx-list .dx-md ul, .dx-list .dx-md ol { margin: 0 0 10px; padding-left: 22px; }
.dx-list .dx-md li { margin: 0 0 4px; }
.dx-list .dx-md hr { border: 0; border-top: 1.5px solid var(--deck-line); margin: 16px 0; }
.dx-list .dx-md a { color: var(--deck-accent); text-decoration: underline; }
.dx-list .dx-md strong { font-weight: 700; }

.dx-list .dx-md blockquote {
  margin: 0 0 12px;
  padding: 8px 14px;
  border-left: 3px solid var(--deck-accent);
  background: var(--deck-surface-2);
  color: var(--deck-muted);
}

.dx-list .dx-md blockquote p:last-child { margin-bottom: 0; }

.dx-list .dx-md code {
  font-family: var(--deck-font-mono, var(--deck-font-text));
  font-size: 13px;
  background: var(--deck-surface-2);
  border-radius: 4px;
  padding: 1px 5px;
}

.dx-list .dx-md pre {
  margin: 0 0 12px;
  padding: 12px 14px;
  background: var(--deck-surface-2);
  border: 1.5px solid var(--deck-line);
  border-radius: 8px;
  overflow-x: auto;
}

.dx-list .dx-md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.45; }

/* Tables in guides are wide (up to six columns of prose) — fixed layout and word wrapping
 * keep them inside the window, rather than pushing out a horizontal scroll of the whole panel. */
.dx-list .dx-md table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  margin: 0 0 14px;
  font-size: 13px;
  line-height: 1.4;
}

.dx-list .dx-md th, .dx-list .dx-md td {
  border: 1px solid var(--deck-line);
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

.dx-list .dx-md th { background: var(--deck-surface-2); font-weight: 700; color: var(--deck-text); }

/* Tables in the item window body. They appeared together with `bodyHtml` (see `compile` of the type): the core `richText`
 * cannot do tables, and markdown markup was glued into a paragraph of pipes. The rules are the same as
 * for the guide tables above: fixed layout and word wrapping keep the table inside
 * the window, rather than pushing out a horizontal scroll of the whole panel. */
.dx-list .dx-ls-win-body table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  margin: 0 0 12px;
  font-size: 13px;
  line-height: 1.4;
}

.dx-list .dx-ls-win-body th,
.dx-list .dx-ls-win-body td {
  border: 1px solid var(--deck-line);
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

.dx-list .dx-ls-win-body th {
  background: var(--deck-surface-2);
  font-weight: 700;
  color: var(--deck-text);
}

.dx-tone-slow   { color: var(--deck-slow); }

/* Stroke of hand-drawn connections (arrows of dx-chain/dx-hub, column outlines of dx-columns, window frame
 * of dx-proof). A separate intent token, and NOT `--deck-line`, because in style packages these two
 * purposes diverge: `--deck-line` is the hairline of a card border, and a light package is entitled to set
 * it semi-transparent. In `hss-aidev` it is set so — `rgba(20,23,26,.14)`, that is 1.34 against
 * the paper: the arrow vanished from the screen entirely, and with it the direction, which in dx-chain
 * is the entire content of the slide. Neither qa-scan (it judges only TEXT against the background), nor measure_layout
 * catches this in principle — caught by eye on the preview of 02.08.
 *
 * The fallback is `--deck-muted`, not `--deck-dim`: the stroke lies not only on paper but also on the fills
 * of `.dx-fill` (14% tone) and on `--deck-bg`, and the threshold for NON-text graphics is 3.0. In hss-aidev
 * dim #838C94 handles the paper (3.24), but fails everything else (bad 2.63 · slow 2.68 · ok 2.70
 * · accent 2.81 · bg 2.75), whereas muted #545E66 holds 5.11–6.62 on each of these
 * surfaces. A package that needs a lighter stroke declares `--deck-dx-stroke` itself —
 * that is what was done in `blueprint`, where the value was chosen by measurement. */
.dx-arrow { position: absolute; inset: 0; pointer-events: none; color: var(--deck-dx-stroke, var(--deck-muted)); overflow: visible; }
.dx-fill  { fill: currentColor; fill-opacity: 0.14; stroke: none; }
.dx-stroke{ fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

/* dx-popup — tiles + a pop-up with scroll.
 * Not a single color or font literal: only --deck-* tokens of the style package. */

.dx-popup {
  padding: 30px 34px 26px;
  gap: 14px;
}

.dx-popup .dx-pop-h {
  font: 700 30px/1.2 var(--deck-font-display);
  color: var(--deck-text);
  margin: 0;
}

.dx-popup .dx-pop-lead {
  font: 400 18px/1.45 var(--deck-font-text);
  color: var(--deck-muted);
  margin: 0;
  max-width: 62ch;
}

/* The island wrapper stretches to the remainder of the height: the overlay is positioned relative to it. */
.dx-popup .dx-pop-wrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.dx-popup .dx-pop-tiles {
  display: grid;
  grid-template-columns: repeat(var(--dx-pop-cols, 2), 1fr);
  gap: 14px;
  align-content: start;
}

.dx-popup .dx-pop-tile {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas:
    'n title'
    '. teaser'
    '. more';
  gap: 4px 10px;
  text-align: left;
  background: var(--deck-surface);
  border: 1.5px solid var(--deck-line);
  border-radius: 12px;
  padding: 14px 16px 12px;
  cursor: pointer;
  transition: background 140ms var(--deck-motion-ease, ease), border-color 140ms var(--deck-motion-ease, ease);
}

.dx-popup .dx-pop-tile:hover {
  background: var(--deck-surface-2);
  border-color: var(--deck-accent);
}

.dx-popup .dx-pop-n {
  grid-area: n;
  font: 700 18px/1.2 var(--deck-font-display);
  color: var(--deck-accent);
}

.dx-popup .dx-pop-tile-title {
  grid-area: title;
  font: 500 19px/1.25 var(--deck-font-text);
  color: var(--deck-text);
}

.dx-popup .dx-pop-teaser {
  grid-area: teaser;
  font: 400 14px/1.35 var(--deck-font-text);
  color: var(--deck-muted);
}

.dx-popup .dx-pop-more {
  grid-area: more;
  font: 500 13px/1.2 var(--deck-font-text);
  color: var(--deck-accent);
  margin-top: 2px;
}

.dx-popup .dx-pop-takeaway {
  font: 500 17px/1.35 var(--deck-font-text);
  color: var(--deck-text);
  margin: 0;
  padding-top: 10px;
  border-top: 1.5px solid var(--deck-line);
}

/* ── overlay ────────────────────────────────────────────────────────────────────
 * The expansion panel of the frame (`.deck-island-panel`) is display:none by default, so
 * the window content stays in the markup for print and text exports, but is not visible.
 * It is expanded by the marker `deck-island-open` on the PARENT — the frame selector
 * `.deck-island-open > .deck-island-panel`. */
.dx-popup .dx-pop-panel {
  position: absolute;
  inset: 0;
  /* The overlay must cover both the tiles and the takeaway: canvas 1200×675, slide position:absolute. */
  z-index: 5;
}

.dx-popup .dx-pop-modal.deck-island-open > .dx-pop-panel {
  display: block;
}

/* The dimming extends beyond the island wrapper to cover the slide margins, but horizontally exactly
 * by the side padding of `.dx-popup` (34px) — not a pixel more. The former -40px on all sides
 * carried the dimming beyond the canvas edge and gave scrollWidth 1204 at a useful 1198: qa-scan
 * catches this as an overflow, and until the type got frames the defect simply was not rendered
 * (the scanner saw only the closed state). */
.dx-popup .dx-pop-scrim {
  position: absolute;
  inset: -40px -34px;
  background: var(--deck-bg);
  opacity: 0.86;
  cursor: pointer;
}

/* The open window is modal: reading the tiles under it is not intended, with 0.86 of dimming they
 * are not visible anyway. We dim them explicitly, otherwise the tile caption ↔ window header overlap remains
 * a real text overlap in the qa-scan measurement, although by eye it is not one. */
.dx-popup .dx-pop-wrap:has(.dx-pop-modal.deck-island-open) .dx-pop-tiles {
  visibility: hidden;
}

.dx-popup .dx-pop-win {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 900px;
  max-width: 100%;
  max-height: 560px;
  display: flex;
  flex-direction: column;
  background: var(--deck-surface);
  border: 2px solid var(--deck-accent);
  border-radius: 14px;
  box-shadow: 0 18px 48px var(--deck-term-shadow);
  overflow: hidden;
}

.dx-popup .dx-pop-win-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 18px;
  border-bottom: 1.5px solid var(--deck-line);
  background: var(--deck-accent-soft);
  flex: 0 0 auto;
}

.dx-popup .dx-pop-win-title {
  font: 700 21px/1.25 var(--deck-font-display);
  color: var(--deck-text);
}

.dx-popup .dx-pop-close {
  font: 400 26px/1 var(--deck-font-display);
  color: var(--deck-muted);
  background: transparent;
  border: 1.5px solid var(--deck-line);
  border-radius: 8px;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  cursor: pointer;
}

.dx-popup .dx-pop-close:hover {
  color: var(--deck-text);
  border-color: var(--deck-accent);
}

/* The only scrollable zone of the type. The scroll lives here, not on the whole window, so that
 * the header with the cross stays in place: otherwise on a long text the close button moves away. */
.dx-popup .dx-pop-win-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 20px;
  font: 400 15px/1.55 var(--deck-font-text);
  color: var(--deck-text);
}

.dx-popup .dx-pop-win-body p {
  margin: 0 0 10px;
}

.dx-popup .dx-pop-win-body p:last-child {
  margin-bottom: 0;
}

.dx-popup .dx-pop-win-body ul,
.dx-popup .dx-pop-win-body ol {
  margin: 0 0 10px;
  padding-left: 20px;
}

.dx-popup .dx-pop-win-body li {
  margin: 0 0 5px;
}

.dx-popup .dx-pop-win-body code {
  font-family: var(--deck-font-mono, var(--deck-font-text));
  background: var(--deck-surface-2);
  border-radius: 4px;
  padding: 1px 5px;
}

.dx-popup .dx-pop-win-src {
  flex: 0 0 auto;
  padding: 8px 20px;
  font: 400 13px/1.35 var(--deck-font-text);
  color: var(--deck-muted);
  border-top: 1.5px solid var(--deck-line);
}

.dx-popup .dx-pop-win-hint {
  flex: 0 0 auto;
  padding: 6px 20px 10px;
  font: 400 12px/1.2 var(--deck-font-text);
  color: var(--deck-muted);
  text-align: right;
}

/* hss-aidev — the Drafting Sheet. Values of the canvas tokens.
 * Scope .deck-canvas: the style paints ONLY the canvas, the Speaker View chrome stays on
 * the neutral tokens of the engine. The rationale for each decision is in DESIGN.md. */
.deck-canvas {
  /* Paper. Three levels of depth give contrast, not shadows:
   * bg — the field around the sheet, slide — the sheet itself, surface — a card ON the sheet. */
  --deck-bg: #E4E7E6;
  --deck-slide: #F8F9F8;
  --deck-surface: #FFFFFF;
  --deck-surface-2: #EEF1F0;
  --deck-line: rgba(20, 23, 26, 0.14);

  /* Ink. Three levels of muting: the main text, the secondary, the service one. */
  --deck-text: #14171A;
  --deck-muted: #545E66;
  --deck-dim: #838C94;

  /* Accent. The HSS brand orange (#E2820F) on light paper gives 2.7:1 and as text is
   * unreadable. The engine sets the accent in a small font size itself (kickers, section labels, the heading
   * of stat), and the package cannot influence this — so the accent must pass the full
   * 4.5:1 threshold, not the large text threshold. Hence the burnt ochre: 4.8:1 against the sheet.
   * The brand brightness is preserved in the -soft fill, where the text goes on top in ink. */
  --deck-accent: #D4761B;
  --deck-accent-soft: rgba(226, 130, 15, 0.14);
  --deck-accent-ink: #1C1305;

  /* Semantics. Muted to the level of a drafting note: the color carries meaning,
   * but does not compete with the accent for attention. */
  --deck-ok: #2D7A55;
  --deck-bad: #BE3B30;
  --deck-slow: #2C6DA6;

  /* Canvas states. */
  --deck-accent-glow: rgba(226, 130, 15, 0.10);
  --deck-ok-tint: rgba(45, 122, 85, 0.09);
  --deck-ok-tint-border: rgba(45, 122, 85, 0.40);
  --deck-bad-tint: rgba(190, 59, 48, 0.08);
  --deck-bad-tint-border: rgba(190, 59, 48, 0.38);
  --deck-live-tint: rgba(44, 109, 166, 0.10);
  --deck-live-tint-border: rgba(44, 109, 166, 0.40);
  --deck-badge-tint: rgba(190, 59, 48, 0.10);
  --deck-badge-tint-border: rgba(190, 59, 48, 0.38);

  /* Terminal. A light package must set bg and text as a PAIR, otherwise the code inherits
   * --deck-text and comes out dark on dark. The dark frame is left deliberately:
   * on a light sheet it reads as a real terminal and works as a point
   * of attention reset. */
  --deck-term-bg: #16191C;
  --deck-term-text: #E8ECEF;
  --deck-term-shadow: rgba(20, 23, 26, 0.16);

  /* The mark is detailed (a dandelion + a graph of thin lines). At 26px it collapses
   * into a gray spot, so the readability ceiling is taken, not the usual 22px. */
  --deck-logo-height: 38px;

  /* Tempo. Restrained: in a long deck animation must not become an event.
   * The morph is shortened relative to the engine default, so as not to lag under screen recording. */
  --deck-motion-appear: 200ms;
  --deck-motion-morph: 900ms;
  --deck-motion-stagger: 60ms;
  --deck-motion-ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  --deck-font-display: 'Onest', sans-serif;
  --deck-font-text: 'Onest', sans-serif;
  --deck-font-mono: 'JetBrains Mono', monospace;
}

/* ── Agenda map for 16 sections ────────────────────────────────────────────────
 *
 * The `program-map` type prints a grid in TWO columns of six rows, that is twelve places.
 * In the deck of module 1 there are sixteen sections (each block has its own guide screen), the third column
 * goes beyond the canvas edge and is cut. The type card names this limitation: 13+ sections
 * break the layout into three unequal columns.
 *
 * We fix it in the style, not in the type: the type lives in the plugin, and its edit would be lost on the first
 * update. A selector with two classes takes specificity, because the style CSS
 * is inlined EARLIER than the type CSS and would lose by order.
 *
 * Three columns of six rows give eighteen places. The captions and time are squeezed for the narrow
 * column: long section names otherwise collapse into an ellipsis. */
.deck-slide.program-map .deck-pmap-grid {
  grid-template-columns: repeat(3, 1fr);
  gap: 8px 22px;
}

.deck-slide.program-map .deck-pmap-row {
  padding: 0 14px;
  gap: 10px;
  border-radius: 8px;
}

.deck-slide.program-map .deck-pmap-time {
  width: 62px;
  font-size: 13px;
}

.deck-slide.program-map .deck-pmap-name {
  font-size: 16px;
}

2573340735090693 15.138907844372259 M0 16 C0.4361832955852151 6.337194527251025, 5.517024934229752 0.9772668709978463, 16.84423319492489 -0.8194477805867791 M1.249129937030375 15.15119039323181 C-1.569701908202842 7.752522473953045, 7.332340187358981 -0.14014932799153013, 15.898192446557804 -1.0924122081976384 M16 0 C16 0, 16 0, 16 0 M16 0 C16 0, 16 0, 16 0\"}],\"w\":366,\"h\":280},\"tone\":\"accent\"}],\"cols\":3}","__dxReserveClass":"","__dxVars":"--dx-grid-gap: 24px; --dx-grid-canvas-pad: 8px 14px; --dx-slide-pad-x: 12px; --dx-slide-pad-y: 8px; --dx-slide-gap: 20px; --dx-h-size: 34px; --dx-h-line: 1.15; "},{"id":"verify","type":"anchor","section":"sec-verify","who":"SG","heading":"Give the agent a check","bullets":["\"The most effective technique\": Anthropic docs","Not \"do X\", but \"do X, and here is the check\"","The cycle: did it, checked, fixed, repeated","Tests, npm run build, screenshots, curl"]},{"id":"pair2","type":"code","section":"sec-verify","who":"SG","heading":"Without verification and with it","code":"# Without verification\nCreate a promo code validation function.\n\n# With verification\nCreate a validatePromo function.\nTest cases:\n- \"SUMMER25\" → true\n- \"summer25\" → true, case does not matter\n- \"SUM MER\" → false, spaces\n- \"\" → false\n- expired code → false\nRun the tests after implementing.","caption":"edge cases are named in advance: the agent will check them itself"},{"id":"picture","type":"anchor","section":"sec-verify","who":"SG","heading":"A picture of the result","bullets":["You do not write tests: describe the result through the user's eyes","Plus the mechanics of verification: how we will know it is done","In plan mode the agent will write the test cases itself","Works not only with code: even with a book"]},{"id":"d4","type":"divider","section":"sec-dose","who":"SG","number":"04","heading":"Sizing the task","preview":["One feature, one prompt","A clean context per task","Effort by task size"]},{"id":"atomic","type":"anchor","section":"sec-dose","who":"SG","heading":"Atomic tasks","bullets":["Not \"do five things\": one self-contained task","In the prompt: task, context, constraints, verification","Each task in a new clean context","Did it, checked it, committed it: next one"]},{"id":"effort","type":"table","section":"sec-dose","who":"SG","heading":"How much to think about a task","columns":["Task","Effort","Why"],"rows":[["Planning","max / high","a mistake at the start snowballs"],["Hard bug","high","deep reasoning is needed"],["Routine","medium","max burns tokens for nothing"]]},{"id":"d5","type":"divider","section":"sec-anti","who":"SG","number":"05","heading":"Anti-patterns","preview":["8 ways to break your work","The two-attempt rule","Cheat sheet: Escape and /clear"]},{"id":"anti8","type":"dx-list","section":"sec-anti","who":"SG","heading":"8 anti-patterns: a map","lead":"Eight typical ways to break your work with the agent. Find yourself by the symptom: each item has a ready fix; we will go through the main ones separately.","items":[{"title":"1 · Mega-prompt: five tasks in one message","teaser":"Symptom: the agent says \"all done\", but parts are missed → Fix: one feature = one prompt, then commit and /clear","body":"**THE POINT.** Five features in one message get tangled into a single lump of changes: the quality of each drops and rolling back just one is impossible. The agent honestly loses focus on the third task out of five and reports \"done\" where parts are missed.\n\n**HOW TO RECOGNIZE IT.** Changes have sprawled across 10+ files, and the first task has not been verified yet.\n\n**FIX.**\n\n- **One feature**, one prompt.\n- Did it, checked it, **committed**.\n- /clear, and then the next task.\n\nBoring, but reproducible: any feature can be rolled back with one commit."},{"title":"2 · Everything in one heap (Kitchen Sink)","teaser":"Unrelated topics in one session: junk creeps into the answers → /clear between topics · more on slide 27","body":"**THE POINT.** Kitchen Sink is a sink where everything gets dumped: we talked about the API, then about the button color, then \"go back to the API\". The agent remembers the whole session and uses this noise in non-obvious ways.\n\n**HOW TO RECOGNIZE IT.** Answers get longer, and details of past, unrelated tasks surface in them.\n\n**FIX.**\n\n- **/clear between topics**: each task in a separate session.\n- Treat sessions **like git branches**: one task, one session."},{"title":"3 · Ghost context: the agent does not remember yesterday","teaser":"Followed the rule yesterday, today the session starts from zero → permanent things go in CLAUDE.md · more on slide 27","body":"**THE POINT.** A \"ghost\" is memory that does not actually exist. Yesterday all evening the agent wrote snake_case, as you asked; today is a new session, and it writes camelCase. It did not \"forget\": every session starts from a blank slate, and yesterday's verbal agreements are not carried into it.\n\n**HOW TO RECOGNIZE IT.** You repeat the same instructions every day; \"but he knew this\" when he did not.\n\n**FIX.**\n\n- Everything permanent goes **in CLAUDE.md**: it is loaded at every start.\n- **Do not count on** session memory at all."},{"title":"4 · Fix Loop","teaser":"Symptom: you fix one thing and another breaks, \"fix\" written for the third time → Fix: Escape and a new prompt","body":"**THE POINT.** \"Fix .co\": the format broke; \"fix the format\": it skips empty lines. Every \"fix\" adds a **failed approach into the context**, and the agent builds the next attempt on a foundation of failures, each worse than the last.\n\n**HOW TO RECOGNIZE IT.** The word \"fix\" has been written for the third time in a row.\n\n**FIX: the two-attempt rule.**\n\n- The first one did not work: **refine the prompt**.\n- The second one did not work: **do not continue**.\n- Escape, /clear, a new prompt with everything you learned, and test cases."},{"title":"5 · Endless polishing (Iterative Refinement)","teaser":"The fifth tweak and it is not getting better → /clear and a better starting prompt · more on slide 29","body":"**THE POINT.** \"Make the shadow softer\", \"increase the padding\", \"no, put it back\"... It looks like work, but after the second iteration quality does not grow, and by the fifth the agent has already **forgotten the original task**.\n\n**HOW TO RECOGNIZE IT.** Five or more tweaks of one screen or component, and the result is marking time.\n\n**FIX.**\n\n- The first prompt gives **80% of the result**: invest time in it, not in the tail of tweaks.\n- In a dead end: ask for a **session summary** as a file (what was tried, what came out) and drop it into a clean session as the first prompt."},{"title":"6 · Exploration without bounds (Infinite Exploration)","teaser":"\"Study the whole project\": hundreds of files in context, answers get dumber, /cost grows → limit the scope","body":"**THE POINT.** \"Figure out how the project works\": the agent honestly reads file after file, each one lands in the context, and by the middle the context is full: answers become less accurate.\n\n**HOW TO RECOGNIZE IT.** File reading does not stop, and /cost shows anomalous token consumption.\n\n**FIX.**\n\n- Limit the **scope**: a specific folder, a specific question.\n- Bad: \"Study the whole repository\", good: \"Look at /src/billing/: where an invoice is created and who marks it as paid\"."},{"title":"7 · Bloated CLAUDE.md: a hundred lines of rules","teaser":"Symptom: rules are followed hit or miss, and all of them at once → Fix: under 100 lines, the test \"if I remove it, will it make a mistake?\"","body":"**THE POINT.** The paradox: the more rules in CLAUDE.md, the worse **each one** is followed — quality drops evenly across all of them, not only the new ones. Extra context creates noise.\n\n**HOW TO SPOT IT.** The agent ignores a rule that is definitely written down; it follows it \"every other time\".\n\n**FIX.**\n\n- Test every line: \"if I remove it, will the agent **make mistakes**?\" If not, delete it.\n- \"Write clean code\" and \"follow best practices\" go first: they are \"for everything good\".\n- A good CLAUDE.md is **like a telegram**: 20–30 lines of specifics."},{"title":"8 · Trust-Then-Verify","teaser":"Symptom: the code looks right but breaks on edge cases → Fix: a way to verify in every prompt","body":"**THE POINT.** The agent confidently presents a solution as working: ask \"did you check everything?\" and it answers \"yes, all good\". The code looks right, an eyeball review passes — and it fails on edge cases that **nobody ran**.\n\n**HOW TO SPOT IT.** Not a single test run in the session; verification postponed \"for later\".\n\n**FIX.**\n\n- The way to verify goes **in the prompt itself**: test cases, a build, a screenshot, curl.\n- A hard rule: **no verification, no production**."}],"takeaway":"For any signal the order is the same: Escape → /clear → rephrase the prompt"},{"id":"mega","type":"code","section":"sec-anti","who":"SG","heading":"Mega-prompt: the road to failure","code":"# Don't do this\nBuild an admin panel with roles, add a dashboard,\nExcel export, Slack notifications\nand a dark theme\n\n# Do this: one feature at a time\nAdd admin and viewer roles via middleware.\n# done → verified → commit → /clear → next","caption":"five features in one message cannot be rolled back one by one"},{"id":"kitchenghost","type":"dx-columns","section":"sec-anti","who":"SG","heading":"Everything in one pile and ghost context","tones":["bad","bad"],"left":{"title":"Everything in one pile","items":["Unrelated tasks in one session","Noise gets in the way of the current task","Fix: /clear between topics"]},"right":{"title":"Ghost context","items":["A new session is a clean slate","Yesterday's rules are forgotten","Fix: put the permanent stuff in CLAUDE.md"]},"__dxGeom":"{\"cols\":[{\"box\":{\"paths\":[{\"kind\":\"fill\",\"d\":\"M15.612423953711987 -0.5233303686976434 C160.55121609807017 -1.6752621889173989, 303.10631653100256 -0.35154958248734 ,"In a dead end: session summary → new context","Invest in the initial prompt, not in corrections"]},{"id":"explore","type":"code","section":"sec-exit","who":"SG","heading":"Unbounded research drowns the context","code":"# Don't do this\nStudy the whole repository and explain the architecture\n\n# Do this\nLook at the payment module in /src/billing/.\nSpecifically: where an invoice is created\nand who marks it as paid.\nWhich files are involved, where it is called from.","caption":"hundreds of files — answers get dumber · recommended: architecture.md — by module, not all at once"},{"id":"telegram","type":"code","section":"sec-exit","who":"SG","heading":"CLAUDE.md as a telegram","code":"# Bloated (100+ lines)\n- We use React          # visible from package.json\n- Code must be readable     # abstract\n- Description of all 40 components # duplicates the code\n\n# Concise (20 lines)\n- make dev — brings everything up locally\n- pytest -m smoke before every PR\n- Migrations only via alembic\n- Merge into main only via PR","caption":"test every line: \"if I remove it, will it make mistakes?\" If not, delete it"},{"id":"trust","type":"anchor","section":"sec-exit","who":"SG","heading":"No verification, no production","bullets":["The code looks right but breaks at the edges","\"Did you check everything?\" — \"Yes\" — and it is not true","Verification: tests, scripts, screenshots, curl","Unverified work does not go to production"]},{"id":"keys","type":"dx-tiles","section":"sec-exit","who":"SG","heading":"Exit cheat sheet: three buttons and a skill","lead":"Three buttons for every day — and a skill that carries a session's knowledge into a new one. The order for any problem: Escape → /clear → new prompt.","items":[{"title":"Escape — the emergency brake","teaser":"The agent is doing the wrong thing → interrupt the run; the context is kept, so you can rephrase","body":"**THE POINT.** Interrupts the current run while the context stays intact: everything the agent has already understood about the task is still there — you can refine the wording and continue.\n\n**WHEN.** The agent went off in the wrong direction and you can see it as it happens: do not wait for the end, stop it right away.\n\n**NUANCE.** Double Escape opens /rewind — rolling back the code, the conversation or both to a checkpoint."},{"title":"/compact — compress without losing the essence","teaser":"The context has bloated but the task is the same → compresses the session history, keeping the main points","body":"**THE POINT.** Compresses the session history while keeping the essence: details go away, decisions and the current state stay.\n\n**WHEN.** A long, legitimate session on one task: the context keeps growing and you do not want to abandon the work.\n\n**NUANCE.** This is not a replacement for /clear: compaction will not cure unrelated topics — the junk gets compressed but stays junk."},{"title":"/clear — full reset","teaser":"A new task or two failed attempts → a clean context; only CLAUDE.md remains","body":"**THE POINT.** A full context reset. The new session starts from a clean slate plus CLAUDE.md and the memory files — your freshly briefed newcomer.\n\n**WHEN.** A new task; two failed attempts; a session cluttered with unrelated topics.\n\n**NUANCE.** Before resetting on a long task, first collect the session summary, see the fourth card."},{"title":"/create-session-history — the move","teaser":"A skill: the session summary as a handoff file → the new context starts with knowledge, not from zero","body":"**THE POINT.** The skill collects the session summary into a handoff file: the goal, what was done, what was decided and why, what did not work, next steps. The new clean session starts with this file — the knowledge moved over, the junk stayed behind.\n\n**WHEN.** Before /clear on any long task: context hygiene without losing what you have built up. This is the tidy version of the \"dead-end summary\" technique from the polishing breakdown.\n\n**WHERE TO GET IT.** The participant repository, folder `M1/skills/create-session-history` — SKILL.md and scripts inside. Full address: https://github.com/Serg1kk/aidev-l1-run2-course-materials/tree/main/M1/skills/create-session-history"}],"takeaway":"The buttons are context hygiene; the skill is for when it is time to change the context but you do not want to lose the knowledge"},{"id":"d6","type":"divider","section":"sec-practice","who":"SG","number":"06","heading":"Demo and exercises","preview":["One task — two prompts","Rephrasing","Constraints and verification"]},{"id":"demo","type":"dx-columns","section":"sec-practice","who":"SG","heading":"Demo: one task — two prompts","left":{"title":"Vague","items":["\"Add form validation\"","It decides on its own which fields","Spinners and toasts as a gift","3–5 new files","Every run gives a different result"]},"right":{"title":"Structured","items":["Context + task + boundaries","Exactly two fields: email and name","Works in existing files","Inline errors, as described","Test cases pass"]},"__dxGeom":"{\"cols\":[{\"box\":{\"paths\":[{\"kind\":\"fill\",\"d\":\"M15.754994510561227 -1.0599806989729406 C196.29059783875942 -4.26475226404369, 376.1345838879049 -4.2030967951029545, 539.3878892029821 -1.440282846838236 C553.9008769168207 -0.6370148096233607, 556.2581246707589 8.869315533464155, 558.2667506787926 17.122015997394918 C556.6522948016286 139.0565491078794, 559.0547400654912 259.5461954458058, 555.7370606361329 567.6539667738974 C553.888124903664 575.143891431267, 552.7832786923894 580.5790936682373, 543.5753570046276 581.6579703781754 C352.34954068034887 585.2483270737737, 165.1943884067237 585.3958820483297, 17.01428991690278 582.5485788141191 C7.798237293337783 581.7790533747524, -1.7145473267883065 579.7526552683363, 3.3198408577591185 566.4380448903888 C1.9033890286207202 446.5981672053039, 1.8645853605985643 324.7674465151131, 1.0666144357621672 17.105428675562145 C-1.5204437527805568 5.192942863081893, 7.744943826024732 1.65009  itself.\n\n- **Why** — what is broken or missing without authorization? That is the context.\n- **What it looks like** — where in the project is there already an example of something similar? Those are the references.\n- **What exactly** — which specific type and scope? That is the task, one action.\n- **What done looks like** — which pages, routes, redirects? That is the format.\n- **What we forbid** — what will the agent want to add on top? Those are the constraints.\n\n**COMMON MISTAKE.** Writing constraints \"in general\" instead of constraints for your project: a prohibition should answer a real risk — \"do not touch the existing users table\", not \"write good code\"."},{"title":"Reference · the finished prompt in full","teaser":"A FastAPI analytics service for 6 people: context, references, task, format, constraints","body":"**CONTEXT.** A FastAPI internal analytics service used by 6 people. Right now all endpoints are open. We need simple protection: no sign-up, only login for existing users.\n\n**REFERENCES.** Look at how dependencies are set up in `/routers/reports.py` — there is already a `Depends` pattern there.\n\n**TASK.** Add session authorization by login and password. Lock down all endpoints except `/login` and `/health`.\n\n**FORMAT.** A `/login` page with a form; a session check in a dependency; an API request without a session gets 401.\n\n**CONSTRAINTS.** Do not add sign-up — login only. No OAuth providers. Users and passwords go in env variables, do not create a separate table. No UI libraries for the form.\n\n**WHY THIS WORKS.** The context explains the \"why\" (an internal service for 6 people means keep it simple), the task is concrete down to the mechanics, and the constraints hit the typical over-engineering."}],"takeaway":"Done criterion: the prompt can be handed to the agent without verbal explanation — everything you would say out loud is already in the text"},{"id":"ex2","type":"dx-tiles","section":"sec-practice","who":"SG","heading":"Exercise 2: constraints and verification","lead":"Take the prompt from the first exercise and strengthen it: three constraints plus a verification block — another 5 minutes.","items":[{"title":"Task · three constraints and a verification block","teaser":"Two questions: what will the agent add that is unnecessary? how do you check that it is done?","body":"**THE POINT.** We strengthen the prompt from the first exercise with two blocks: constraints against over-engineering and verification that the agent runs itself.\n\n**STEPS.**\n\n1. Think about what the agent might add that is unnecessary in your particular task. Forbid it — at least three items.\n\n2. Think about how to verify the result. Give the agent a way to self-check: test cases, a build command, a manual verification scenario.\n\n**DONE CRITERION.** From your verification block, the agent can determine on its own that the task is complete — without your involvement."},{"title":"Hint · what unnecessary things the agent will add","teaser":"Example: \"do not create new files except the two named\", \"no logging and analytics\"","body":"**THE POINT.** A good constraint is targeted: it hits a specific risk of your task, not an abstract \"bad code\".\n\n- **Files** — \"do not create new files except `page.tsx` and `middleware.ts`\": the agent loves to spawn utilities.\n- **Dependencies** — \"do not add npm packages except the one named\": every task carries the temptation of a new shiny library.\n- **Boundaries** — \"do not touch existing pages\": changes should stay local.\n- **Noise** — \"no logging, analytics, or comments on every line\".\n\n**SELF-CHECK.** Every constraint should answer the question \"what will I be cleaning up by hand if I do not write this?\""},{"title":"Reference · constraints and verification in full","teaser":"Five verification steps: from 401 without a session to a green pytest -m smoke","body":"**CONSTRAINTS (extended).** Do not create new files except the login router and the session module. Do not add packages except one, named, for sessions. Do not touch existing routers — only wrap them with a dependency. Do not add logging and analytics.\n\n**VERIFICATION.** After implementation, check:\n\n1. A request to any endpoint without a session — 401.\n\n2. `/health` responds without authorization.\n\n3. A wrong password — an error on the form.\n\n4. Correct credentials — a redirect to the home page.\n\n5. `pytest -m smoke` — all tests green.\n\n**WHY THIS WORKS.** The constraints freeze the change surface (two new files, one package), and the five steps cover protection, exceptions, errors and regression — the agent runs them itself and fixes what it finds before showing the result."}],"takeaway":"Constraints freeze the change surface, the agent runs verification itself — before showing the result"},{"id":"interview","type":"anchor","section":"sec-final","who":"SG","heading":"Ask me questions","bullets":["\"Write the prompt for me\" — the novice's path","Stronger: \"ask me questions so you can solve the task\"","Then: \"assemble the prompt from the five elements\"","The agent pulls the context out of your head by itself"]},{"id":"final","type":"manifest","section":"sec-final","who":"SG","text":"A clean session with a new prompt beats a long one with corrections","sub":"Anthropic Best Practices"}]},"mode":"audience","showBadges":false,"showTimeline":true,"layout":"bottom","styleLogo":{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGkAAACLCAYAAABiDrezAAAc3klEQVR4nO1d3VEbSxMdvrrvyK/7IjkC5AiACIAIEBGAIwAiACIwRICIwBCBRQSWXvb1ShHwVbfP2Xs0ml3tSrJBsrqKQtL+T890n/7dEDaAsixrZVn2w/6HDaT/hQ2gPM/HIYR+COFUmHYeNoTWlklZlnVs9chPzyGEY3zeDyEY47b03pRl2XmWZTfy/Sf+X4YNog+3kubplezXCrq0/fI8v7MVo0zJsuwohDCU73v2F9aY3pVJGPDvWZa18b0bQqhcBXmeGwMeQgiPWZad5nl+jWNN9HVCCAd5nj9AL5mO+pTn+WtYY9p57xvALL8NIZyEEGwVXeZ5fibbRgAGqWNNB3GVXOB40033IYRBFXNsgtixeZ4/hQ9O/3tvkYaBNGRmaKxFUYV9LsoYhGP7YMoQjNFtBYNspWZZtm+iEP+Nud/suli9H5reZSVBb1wZGsvzfITfHsGssc1uAIJbbo+ONwbaOYyejJEmNsFkY8BBCKEHx <script>var __HELPERS_FACTORY__ = function makeHelpers() {
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }
  function inlineHtml(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code class="deck-ic">$1</code>')
  }
  function richText(s) {
    var blocks = String(s || '').split(/\n{2,}/)
    return blocks
      .map(function (b) {
        var lines = b.split(/\n/)
        var isList = lines.length > 1 && lines.every(function (l) {
          return /^\s*[-•]\s+/.test(l) || l.trim() === ''
        })
        if (isList) {
          return (
            '<ul class="deck-ul">' +
            lines
              .filter(function (l) {
                return l.trim()
              })
              .map(function (l) {
                return '<li>' + inlineHtml(l.replace(/^\s*[-•]\s+/, '').trim()) + '</li>'
              })
              .join('') +
            '</ul>'
          )
        }
        return '<p>' + inlineHtml(b.replace(/\n/g, ' ').trim()) + '</p>'
      })
      .join('')
  }
  function attr(v) {
    return String(v == null ? '' : v).replace(/"/g, '&quot;')
  }
  /* The island state key by slide and path in its payload. The key format is an internal matter
   * of the helper: types must call ONLY it and never glue the string by hand, otherwise six
   * modules will drift apart on a space or an index format and the island will silently stop being found. */
  function islandKey(slide, path) {
    return String((slide && slide.id) || '') + ':' + String(path)
  }
  function imgHtml(img, mode) {
    if (!img) return ''
    if (img.src) {
      return '<img class="deck-img" src="' + attr(img.src) + '" alt="' + attr(img.alt || '') + '">'
    }
    // placeholder
    if (mode === 'audience') {
      return '<div class="deck-imgph"><div class="deck-imgph-top"><span class="deck-imgph-icon">image</span></div></div>'
    }
    var out = '<div class="deck-imgph"><div class="deck-imgph-top"><span class="deck-imgph-label">PLACEHOLDER</span></div>'
    if (img.prompt) {
      out += '<p class="deck-imgph-prompt">' + esc(img.prompt) + '</p>'
      out += '<button class="deck-imgph-copy" data-act="copy" data-prompt="' + attr(img.prompt) + '">⧉ copy prompt</button>'
    }
    return out + '</div>'
  }
  return { esc, inlineHtml, richText, attr, imgHtml, islandKey }
};
var __PRIMITIVES_FACTORY__ = function makePrimitives(h) {
  // metric — a one-figure tile (stat; future chart captions). i (0-based) gives the footnote number
  // <sup>, if the tile has a source; the footnote aggregate in the footer is the concern of the calling type.
  function metric(item, i) {
    var small = (item.value || '').length > 4 ? ' small' : ''
    var sup = item.source ? '<sup>' + (i + 1) + '</sup>' : ''
    return '<div><div class="deck-stat-value' + small + '">' + h.esc(item.value) + sup + '</div>' +
      '<div class="deck-stat-label">' + h.inlineHtml(item.label) + '</div></div>'
  }

  // dataTable — a head+body grid (table; future expanders 09). The width of the first column is fixed,
  // the rest are equal. g.dense is a slide-level modifier, it does not change the grid markup itself (reserve).
  function dataTable(g) {
    var cols = g.columns || []
    var rows = g.rows || []
    var grid = 'grid-template-columns:150px repeat(' + Math.max(cols.length - 1, 1) + ',1fr)'
    var head = '<div class="deck-tbl-head" style="' + grid + '">' +
      cols.map(function (c) { return '<span>' + h.esc(c) + '</span>' }).join('') + '</div>'
    var body = rows.map(function (r) {
      return '<div class="deck-tbl-row" style="' + grid + '">' +
        r.map(function (cell, j) {
          var cls = j === 0 ? 'c0' : 'cx' + (r.length > 2 && j === r.length - 1 ? ' muted' : '')
          return '<span class="' + cls + '">' + h.inlineHtml(cell) + '</span>'
        }).join('') + '</div>'
    }).join('')
    return head + '<div class="deck-tbl-body">' + body + '</div>'
  }

  // mediaBlock is an image slot: a wrapper with the slot class + the low-level h.imgHtml (the ready-made
  // image / placeholder with the Speaker prompt). An empty img → an empty string (not an empty slot).
  function mediaBlock(img, mode, cls) {
    if (!img) return ''
    return '<div class="' + cls + '">' + h.imgHtml(img, mode) + '</div>'
  }

  // badgeList: chips / badge cards (offer.bullets, divider.preview; the future cards). Default is
  // <ul class="cls"><li>…</li></ul>; opt overrides the container/item tags and the item class
  // (card variant of divider.preview: container/item=div, itemClass=deck-div-card).
  function badgeList(items, cls, opt) {
    opt = opt || {}
    var con = opt.container || 'ul'
    var itemTag = opt.item || 'li'
    var itemCls = opt.itemClass ? ' class="' + opt.itemClass + '"' : ''
    var inner = (items || []).map(function (x) {
      return '<' + itemTag + itemCls + '>' + h.inlineHtml(x) + '</' + itemTag + '>'
    }).join('')
    return '<' + con + ' class="' + cls + '">' + inner + '</' + con + '>'
  }

  // textList is a bulleted list with inline markup, the item is wrapped in <span> (anchor, compare).
  // Default is <ul class="cls"><li><span>…</span></li></ul>; opt.item/itemClass change the tag/class
  // of the item, opt.bare returns only the items without a container (compare puts them straight into the column).
  function textList(items, cls, opt) {
    opt = opt || {}
    var itemTag = opt.item || 'li'
    var itemCls = opt.itemClass ? ' class="' + opt.itemClass + '"' : ''
    var inner = (items || []).map(function (x) {
      return '<' + itemTag + itemCls + '><span>' + h.inlineHtml(x) + '</span></' + itemTag + '>'
    }).join('')
    if (opt.bare) return inner
    return '<ul class="' + cls + '">' + inner + '</ul>'
  }

  return { metric: metric, dataTable: dataTable, mediaBlock: mediaBlock, badgeList: badgeList, textList: textList }
};
