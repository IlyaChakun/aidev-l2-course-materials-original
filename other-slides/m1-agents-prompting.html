/* deckfeatai engine E1 — structural CSS of the deck.
 * Canvas 1200×675, scale-fit. The token values here are NEUTRAL (chrome: prompter,
 * timeline, status line). Brand values come from the style package (tokens.css,
 * scope .deck-canvas) — a foreign style cannot break the Speaker chrome. */

/* ── Notes window markers ──
 * The pair NOTES-WINDOW-CSS-START/END marks the pieces that the runtime cuts out of the ASSEMBLED
 * <style> of the deck and puts into the presenter notes window (a second browser window; see engine/README.md,
 * the Presenter notes window section). There are two regions: this one is the chrome base (--deck-* tokens,
 * box-sizing, scrollbars) — and the prompter panel block below.
 *
 * Why the base travels with the panel: the .deck-pp* rules are written with variables declared
 * ONLY on .deck-root, while the window is born from about:blank, where there is no such element. The runtime
 * wraps the window body in a .deck-root element, so the token declarations must be there too.
 *
 * The cutting is NOT destructive (unlike the cut by ELEMENT-TYPES-CSS): the marked piece
 * stays in the shared CSS of the deck, and the window reads the same bytes that the deck itself is drawn with,
 * so there is no manual copy of the rules and nothing to drift apart. Guarded by scripts/tests/notes-window.test.mjs. */
/* ── NOTES-WINDOW-CSS-START ── */
/* Typing of the proportion token. An unregistered custom property is substituted as is,
 * and NON-numeric junk (abc, 10px, 45%) makes both proportion declarations invalid at
 * computed-value time — the `flex` shorthand falls to `unset` ENTIRELY, that is `flex-grow: 0`,
 * and the canvas area gets height 0: the slide disappears from the screen. The fallback
 * `var(--deck-speaker-split, 45)` does not help here — the token is always declared on .deck-root,
 * the substitution has happened, and the fallback is never reached. With registration such a value
 * is filtered out by type and the property rolls back to initial-value, that is to the former 45/55.
 * initial-value must match the value on .deck-root.
 * BOUNDARY: registration judges the TYPE, not the range — `-10`, `0`, `100` pass through it entirely
 * (the `syntax` descriptor has no range). The corridor is held by the channel that sets the value, not by CSS.
 * Both the protection and its boundary are checked by scripts/tests/speaker-split-guard.test.mjs. */
@property --deck-speaker-split { syntax: '<number>'; inherits: true; initial-value: 45; }

.deck-root {
  --deck-bg: #0d0e11;
  --deck-slide: #101216;
  --deck-surface: #171a20;
  --deck-surface-2: #1e222a;
  --deck-line: rgba(180, 190, 205, 0.14);
  --deck-text: #eceef2;
  --deck-muted: #8f96a3;
  --deck-dim: #5c6270;
  --deck-accent: #d0d6e0;
  --deck-accent-soft: rgba(208, 214, 224, 0.14);
  --deck-accent-ink: #10141a;
  --deck-ok: #67c98b;
  --deck-bad: #e07777;
  --deck-slow: #7aa3d6;
  /* the `**word**` mark in the prompter panel. A CHROME token: the panel lies outside the canvas, the style
   * package does not reach it, and --deck-accent CANNOT be used here — in the chrome it
   * resolves to light gray #d0d6e0 and gives a contrast of 1.26:1 against the cue text, so the
   * rule would look fulfilled while there would be no highlight. The value is warm (the palette
   * of the chrome is cold gray, a warm spot blends with nothing) and is tuned apart from the semantic
   * ok/bad/slow, so the mark is not read as a status. The thresholds (≥4.5 against the panel background and the
   * chip background, ΔE to the status ones) are computed by scripts/tests/prompter-panel.test.mjs. */
  --deck-pp-key: #d4761b;
  /* the base text of the prompter panel is muted relative to --deck-text on purpose: the panel
   * is divided into blocks by levels, not by reading. There are three levels — the subsection label (dim, but
   * with a line), the base text, the mark. At --deck-text the base text was at the ceiling, and
   * the highlight had nowhere to stand. Muting shifts the base toward the highlight, so the separation of
   * --deck-pp-key from this value is recalculated and guarded by the same test. */
  --deck-pp-text: #c9ced8;
  --deck-font-display: system-ui, sans-serif;
  --deck-font-text: system-ui, sans-serif;
  --deck-font-mono: ui-monospace, 'SF Mono', Menlo, monospace;

  --deck-fit: 1;
  /* the share of the CANVAS in the working area of the Detailed mode, out of 100; the panel gets the remainder
   * (100 − split). Default 45 — exactly the former hard-wired behavior (canvas 45, panel 55).
   * A CHROME token: lives on .deck-root, while the style package paints only .deck-canvas and does not
   * reach it — the value comes from the deck author, not from the style. The proportion is constant
   * across the whole deck and does NOT depend on the prompter volume: a panel that grows with its content would drive
   * --deck-fit on every transition and make the canvas jump between screens. */
  --deck-speaker-split: 45;

  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  background: var(--deck-bg);
  color: var(--deck-text);
  font-family: var(--deck-font-text);
  overflow: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--deck-surface-2) transparent;
}
.deck-root *,
.deck-root *::before,
.deck-root *::after {
  box-sizing: border-box;
}
.deck-root ::selection {
  background: var(--deck-accent);
  color: var(--deck-accent-ink);
}
/* thin dark scrollbars for the inner containers of the deck */
.deck-root ::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.deck-root ::-webkit-scrollbar-track {
  background: transparent;
}
.deck-root ::-webkit-scrollbar-thumb {
  background: var(--deck-surface-2);
  border-radius: 8px;
}
.deck-root ::-webkit-scrollbar-thumb:hover {
  background: var(--deck-dim);
}
/* ── NOTES-WINDOW-CSS-END ── */

/* ── timeline (top) ── */
.deck-timeline {
  flex: none;
  display: flex;
  gap: 6px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--deck-line);
  background: var(--deck-bg);
  overflow-x: auto;
}
.deck-tl-sec {
  flex: 1 1 0;
  min-width: 72px;
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  border-radius: 8px;
  padding: 7px 9px;
  cursor: pointer;
  text-align: left;
  color: inherit;
  font: inherit;
  transition: border-color 0.15s;
}
.deck-tl-sec:hover {
  border-color: var(--deck-accent);
}
.deck-tl-sec.active {
  background: var(--deck-accent-soft);
  border-color: var(--deck-accent);
}
.deck-tl-time {
  font: 500 10px var(--deck-font-mono);
  color: var(--deck-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.deck-tl-name {
  font: 600 11.5px var(--deck-font-text);
  color: var(--deck-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.deck-tl-sec.active .deck-tl-name {
  color: var(--deck-accent);
}
.deck-tl-dots {
  display: flex;
  gap: 4px;
  margin-top: 5px;
  height: 6px;
}
.deck-tl-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  border: 0;
  padding: 0;
  background: rgba(255, 255, 255, 0.22);
  cursor: pointer;
}
.deck-tl-dot.on {
  background: var(--deck-accent);
}

/* ── main / canvas area ── */
.deck-main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 16px 18px;
  gap: 12px;
}
.deck-canvas-area {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.deck-root[data-mode='detailed'] .deck-canvas-area {
  flex: var(--deck-speaker-split) 1 0;
}

/* ── speaker-layout: variants of the prompter panel placement (data-layout on .deck-root) ──
 * bottom (default) — the panel is UNDER the canvas (the .deck-pp / .deck-canvas-area rules above and below).
 * The layout is set by the engine; the audience does not render the panel, so for it these are dead rules. */

/* side — the panel becomes the right column over the full height of main, canvas on the left */
.deck-root[data-layout='side'] .deck-main {
  flex-direction: row;
}
.deck-root[data-layout='side'] .deck-pp {
  flex: 0 0 340px;
  max-height: none;
  overflow-y: auto;
}
/* narrow window — as a column: the panel returns under the canvas (degradation to the bottom behavior) */
@media (max-width: 980px) {
  .deck-root[data-layout='side'] .deck-main {
    flex-direction: column;
  }
  .deck-root[data-layout='side'] .deck-pp {
    flex: calc(100 - var(--deck-speaker-split)) 1 0;
  }
}

/* overlay — the panel goes into a semi-transparent overlay over the bottom of the canvas (inside .deck-canvas-area) */
.deck-root[data-layout='overlay'] .deck-pp {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 45%;
  overflow-y: auto;
  background: color-mix(in srgb, var(--deck-surface) 90%, transparent);
  z-index: 9;
}
/* in overlay the canvas is not squeezed for the panel — the overlay goes on top, not taking space */
.deck-root[data-layout='overlay'][data-mode='detailed'] .deck-canvas-area {
  flex: 1 1 0;
}

/* click zones of the edges (inside the canvas, in the slide padding field, under the chrome) */
.deck-zone {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 56px;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  background: transparent;
  color: var(--deck-dim);
  font-size: 34px;
  opacity: 0.5;
  transition: opacity 0.15s, background 0.15s;
}
.deck-zone.left {
  left: 0;
  cursor: w-resize;
}
.deck-zone.right {
  right: 0;
  cursor: e-resize;
}
.deck-zone.left:hover:not(:disabled) {
  opacity: 1;
  background: linear-gradient(90deg, var(--deck-accent-glow, rgba(200, 255, 61, 0.06)), transparent);
}
.deck-zone.right:hover:not(:disabled) {
  opacity: 1;
  background: linear-gradient(270deg, var(--deck-accent-glow, rgba(200, 255, 61, 0.06)), transparent);
}
.deck-zone:disabled {
  opacity: 0;
  cursor: default;
}

/* fixed canvas 1200×675, centered and fitted via translate+scale
 * (translate(-50%,-50%) gives a letterbox regardless of the area size — without clipping) */
.deck-canvas {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1200px;
  height: 675px;
  background: var(--deck-slide);
  border: 1px solid var(--deck-line);
  border-radius: 16px;
  overflow: hidden;
  color: var(--deck-text);
  transform: translate(-50%, -50%) scale(var(--deck-fit));
  transform-origin: center center;
}
.deck-canvas strong {
  color: var(--deck-accent);
  font-weight: inherit;
}
/* Inline code (backticks). The SHAPE — in all scopes: the monospace face is the very
 * point of the class. The COLOR, however, is scoped to the canvas on purpose: outside the canvas `--deck-accent`
 * resolves to the neutral light gray of the chrome, and a rule to paint with the accent there meant
 * exactly to blend with the text. The prompter panel has its own rule — below, in its block. */
.deck-ic {
  font-family: var(--deck-font-mono);
  font-size: 0.92em;
}
.deck-canvas .deck-ic {
  color: var(--deck-accent);
}

/* ── chrome inside the canvas: badges, toggle, cue line ── */
.deck-badges {
  position: absolute;
  top: 22px;
  right: 26px;
  display: flex;
  gap: 10px;
  align-items: center;
  z-index: 8;
}
.deck-logo {
  display: block;
  height: var(--deck-logo-height, 22px);
  width: auto;
  opacity: 0.92;
  pointer-events: none;
}
/* the style logo of the style package — a separate canvas element (outside the badges): positional
 * classes put it in a corner in the canvas field (~28px from the edge, inside the ~56px slide field,
 * without overlapping the content). The logo in the badges of a positional class is not carried — it stays in the flow. */
.deck-logo-tl,
.deck-logo-tr,
.deck-logo-bl,
.deck-logo-br {
  position: absolute;
  z-index: 8;
}
.deck-logo-tl {
  top: 28px;
  left: 28px;
}
.deck-logo-tr {
  top: 28px;
  right: 28px;
}
.deck-logo-bl {
  bottom: 28px;
  left: 28px;
}
.deck-logo-br {
  bottom: 28px;
  right: 28px;
}
.deck-timing {
  font: 500 14px var(--deck-font-mono);
  color: var(--deck-muted);
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  padding: 6px 14px;
  border-radius: 999px;
  white-space: nowrap;
}
.deck-spks {
  display: flex;
}
.deck-spk {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--deck-surface-2);
  border: 1px solid var(--deck-line);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 14px var(--deck-font-text);
}
.deck-spk + .deck-spk {
  margin-left: -16px;
}

.deck-toggle {
  position: absolute;
  top: 20px;
  left: 26px;
  display: flex;
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  border-radius: 999px;
  padding: 3px;
  z-index: 9;
}
.deck-toggle button {
  font: 600 13px var(--deck-font-text);
  border: 0;
  background: transparent;
  color: var(--deck-muted);
  border-radius: 999px;
  padding: 6px 16px;
  cursor: pointer;
}
.deck-toggle button.on {
  background: var(--deck-accent);
  color: var(--deck-accent-ink);
}

.deck-cue {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 58px;
  border: 0;
  border-top: 1px solid var(--deck-line);
  background: var(--deck-surface);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 28px;
  z-index: 7;
  cursor: pointer;
  color: inherit;
  width: 100%;
  text-align: left;
}
.deck-cue-label {
  font: 700 12px var(--deck-font-mono);
  color: var(--deck-accent);
  letter-spacing: 0.14em;
}
.deck-cue-chip {
  font: 500 13px var(--deck-font-mono);
  color: var(--deck-muted);
  background: var(--deck-surface-2);
  border: 1px solid var(--deck-line);
  border-radius: 999px;
  padding: 4px 12px;
  white-space: nowrap;
}
.deck-cue-more {
  margin-left: auto;
  font: 500 13px var(--deck-font-mono);
  color: var(--deck-dim);
  white-space: nowrap;
}

/* each slide fills the canvas */
.deck-slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  font-family: var(--deck-font-text);
}

/* ── 01 title ── */
.deck-slide.title {
  padding: 0;
}
.deck-title-mark {
  position: absolute;
  top: 26px;
  left: 48px;
  color: var(--deck-accent);
  font: 700 30px var(--deck-font-display);
  letter-spacing: 0.04em;
}
.deck-title-body {
  position: absolute;
  left: 48px;
  right: 48px;
  top: 196px;
}
.deck-title-kicker {
  font: 500 16px var(--deck-font-mono);
  color: var(--deck-accent);
  letter-spacing: 0.16em;
  margin-bottom: 22px;
}
.deck-title-h {
  font: 700 74px/1.12 var(--deck-font-display);
  margin: 0;
}
.deck-title-sub {
  font: 400 22px/1.5 var(--deck-font-text);
  color: var(--deck-muted);
  margin: 24px 0 0;
  max-width: 900px;
}
.deck-title-foot {
  position: absolute;
  left: 48px;
  right: 48px;
  bottom: 44px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.deck-title-foot .deck-spk {
  width: 44px;
  height: 44px;
  font-size: 17px;
}
.deck-title-foot .deck-spk + .deck-spk {
  margin-left: -26px;
}
.deck-title-names {
  font: 500 22px var(--deck-font-text);
}
.deck-title-dot {
  color: var(--deck-dim);
}
.deck-title-dur {
  font: 400 20px var(--deck-font-text);
  color: var(--deck-muted);
}

/* ── 02 program-map ── */
.deck-slide.program-map {
  padding: 48px 56px;
}
.deck-pmap-h {
  font: 600 44px var(--deck-font-display);
  margin: 0 0 8px;
}
.deck-pmap-sub {
  font: 400 16px var(--deck-font-text);
  color: var(--deck-dim);
  margin-bottom: 26px;
}
.deck-pmap-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-flow: column;
  grid-template-rows: repeat(6, 1fr);
  gap: 10px 40px;
}
.deck-pmap-row {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  border-radius: 10px;
  padding: 0 18px;
  cursor: pointer;
  color: inherit;
  font: inherit;
  text-align: left;
  transition: border-color 0.15s;
}
.deck-pmap-row:hover {
  border-color: var(--deck-accent);
}
.deck-pmap-row.active {
  background: var(--deck-accent-soft);
  border-color: var(--deck-accent);
}
.deck-pmap-time {
  font: 500 15px var(--deck-font-mono);
  color: var(--deck-muted);
  width: 104px;
  flex: none;
}
.deck-pmap-name {
  font: 500 20px var(--deck-font-text);
  color: var(--deck-text);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.deck-pmap-row.active .deck-pmap-name {
  color: var(--deck-accent);
}
.deck-pmap-sp {
  font: 700 12px var(--deck-font-mono);
  color: var(--deck-muted);
  background: var(--deck-surface-2);
  border: 1px solid var(--deck-line);
  border-radius: 999px;
  padding: 5px 10px;
  flex: none;
}

/* ── 03 divider ── */
.deck-slide.divider {
  padding: 52px 56px;
}
.deck-div-num {
  font: 700 120px/1 var(--deck-font-display);
  color: transparent;
  -webkit-text-stroke: 2px var(--deck-accent);
  white-space: nowrap;
}
.deck-div-h {
  font: 600 52px/1.15 var(--deck-font-display);
  margin: 10px 0 0;
}
.deck-div-preview {
  margin-top: auto;
}
.deck-div-plabel {
  font: 500 14px var(--deck-font-mono);
  color: var(--deck-dim);
  letter-spacing: 0.14em;
  margin-bottom: 18px;
}
.deck-div-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.deck-div-card {
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  border-radius: 12px;
  padding: 16px 20px;
  font: 400 19px/1.4 var(--deck-font-text);
}

/* ── 04 anchor ── */
.deck-slide.anchor {
  padding: 0;
}
.deck-anchor-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 48px;
  padding: 64px 56px 24px;
}
.deck-anchor-kicker {
  font: 500 15px var(--deck-font-mono);
  color: var(--deck-accent);
  letter-spacing: 0.16em;
  margin-bottom: 20px;
}
.deck-anchor-h {
  font: 600 56px/1.15 var(--deck-font-display);
  margin: 0;
  text-wrap: pretty;
}
.deck-anchor-fn {
  margin-top: 22px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.deck-anchor-fn p {
  margin: 0;
  font: 400 15px/1.45 var(--deck-font-mono);
  color: var(--deck-dim);
}
.deck-anchor-bullets {
  display: flex;
  flex-direction: column;
  gap: 22px;
  justify-content: center;
  list-style: none;
  margin: 0;
  padding: 0;
}
.deck-anchor-bullets li {
  display: flex;
  gap: 16px;
  align-items: baseline;
}
.deck-anchor-bullets li::before {
  content: '';
  width: 12px;
  height: 12px;
  background: var(--deck-accent);
  flex: none;
  transform: translateY(1px);
}
.deck-anchor-bullets span {
  font: 400 27px/1.35 var(--deck-font-text);
}
.deck-anchor-img {
  margin-top: 22px;
}
.deck-anchor-img .deck-img {
  width: auto;
  max-width: 100%;
  max-height: 260px;
}
.deck-anchor-img .deck-imgph-prompt {
  max-height: 140px;
  overflow: auto;
}

/* ── 05 manifest ── */
.deck-slide.manifest {
  align-items: center;
  justify-content: center;
  padding: 0 90px;
  text-align: center;
}
.deck-manifest-text {
  font: 600 62px/1.3 var(--deck-font-display);
  margin: 0;
  text-wrap: balance;
}
.deck-manifest-sub {
  font: 400 17px var(--deck-font-mono);
  color: var(--deck-dim);
  margin: 40px 0 0;
}

/* ── 06 stat ── */
.deck-slide.stat {
  padding: 56px;
}
.deck-stat-kicker {
  font: 500 15px var(--deck-font-mono);
  color: var(--deck-accent);
  letter-spacing: 0.16em;
}
.deck-stat-grid {
  flex: 1;
  display: grid;
  gap: 44px;
  align-items: center;
  margin-top: 12px;
}
.deck-stat-grid.n-1 {
  grid-template-columns: 1fr;
}
.deck-stat-grid.n-2 {
  grid-template-columns: 1fr 1fr;
}
.deck-stat-grid.n-3 {
  grid-template-columns: 1fr 1fr 1fr;
}
.deck-stat-grid.n-4 {
  grid-template-columns: repeat(4, 1fr);
}
.deck-stat-value {
  font: 700 108px/1 var(--deck-font-display);
  color: var(--deck-accent);
  letter-spacing: -0.02em;
}
.deck-stat-value.small {
  font-size: 72px;
}
/* compact variant: more than 4 stat tiles (2 rows).
 * A single font size + nowrap: values of different length stand on one line and are aligned with each other. */
.deck-stat-grid.many {
  gap: 30px 36px;
  align-content: center;
  align-items: start;
}
.deck-stat-grid.many .deck-stat-value,
.deck-stat-grid.many .deck-stat-value.small {
  font-size: 30px;
  white-space: nowrap;
}
.deck-stat-grid.many .deck-stat-label {
  font-size: 15px;
  margin-top: 10px;
}
.deck-stat-value sup {
  font: 500 24px var(--deck-font-mono);
  color: var(--deck-muted);
  vertical-align: 52px;
  margin-left: 4px;
}
.deck-stat-label {
  font: 400 21px/1.4 var(--deck-font-text);
  color: var(--deck-muted);
  margin-top: 18px;
}
.deck-stat-foot {
  border-top: 1px solid var(--deck-line);
  padding-top: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px 28px;
  font: 400 14px var(--deck-font-mono);
  color: var(--deck-dim);
}
.deck-stat-foot b {
  color: var(--deck-muted);
  font-weight: 500;
  margin-right: 4px;
}

/* ── 07 process (ladder) ── */
.deck-slide.process {
  padding: 48px 56px;
}
.deck-proc-top {
  display: flex;
  gap: 32px;
  align-items: flex-start;
}
.deck-proc-h {
  font: 600 38px var(--deck-font-display);
  max-width: 620px;
  margin: 0;
}
.deck-proc-img {
  width: 320px;
  margin-left: auto;
  flex: none;
}
.deck-stairs {
  display: flex;
  gap: 14px;
  align-items: flex-end;
  margin-top: auto;
}
.deck-step {
  flex: 1 1 0;
  min-width: 0;
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  border-radius: 12px;
  padding: 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
}
.deck-step.hot {
  background: var(--deck-accent-soft);
  border-color: var(--deck-accent);
}
.deck-step-num {
  font: 500 12px var(--deck-font-mono);
  color: var(--deck-muted);
  letter-spacing: 0.12em;
}
.deck-step.hot .deck-step-num {
  color: var(--deck-accent);
}
.deck-step-name {
  font: 600 16px/1.2 var(--deck-font-text);
}
.deck-step-gain {
  font: 400 12.5px/1.35 var(--deck-font-text);
  color: var(--deck-ok);
}
.deck-step-breaks {
  font: 400 12.5px/1.35 var(--deck-font-text);
  color: var(--deck-bad);
}

/* ── 08 compare ── */
.deck-slide.compare {
  padding: 52px 56px;
}
.deck-cmp-h {
  font: 600 42px var(--deck-font-display);
  margin: 0 0 36px;
}
.deck-cmp-cols {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.deck-cmp-col {
  border-radius: 14px;
  padding: 32px 34px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow: hidden;
}
/* semantics: left column = pros (ok green), right = cons (bad red) */
.deck-cmp-col.left {
  background: var(--deck-ok-tint, rgba(84, 217, 124, 0.08));
  border: 1px solid var(--deck-ok-tint-border, rgba(84, 217, 124, 0.45));
}
.deck-cmp-col.right {
  background: var(--deck-bad-tint, rgba(255, 107, 107, 0.07));
  border: 1px solid var(--deck-bad-tint-border, rgba(255, 107, 107, 0.4));
}
.deck-cmp-title {
  font: 600 24px var(--deck-font-text);
}
.deck-cmp-col.left .deck-cmp-title {
  color: var(--deck-ok);
}
.deck-cmp-col.right .deck-cmp-title {
  color: var(--deck-bad);
}
.deck-cmp-item {
  display: flex;
  gap: 14px;
  align-items: baseline;
}
.deck-cmp-item::before {
  content: '';
  width: 10px;
  height: 10px;
  flex: none;
  transform: translateY(1px);
}
.deck-cmp-col.left .deck-cmp-item::before {
  background: var(--deck-ok);
}
.deck-cmp-col.right .deck-cmp-item::before {
  background: var(--deck-bad);
}
.deck-cmp-item span {
  font: 400 22px/1.4 var(--deck-font-text);
}

/* ── 09 table ── */
.deck-slide.table {
  padding: 52px 56px;
}
.deck-tbl-h {
  font: 600 40px var(--deck-font-display);
  margin: 0 0 26px;
}
.deck-tbl-head,
.deck-tbl-row {
  display: grid;
  gap: 0 24px;
  align-items: center;
}
.deck-tbl-head {
  padding: 0 20px 14px;
  font: 500 13px var(--deck-font-mono);
  color: var(--deck-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.deck-tbl-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
  overflow: auto;
}
.deck-tbl-row {
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  border-radius: 10px;
  padding: 14px 20px;
}
.deck-tbl-row .c0 {
  font: 700 17px var(--deck-font-mono);
  color: var(--deck-accent);
}
.deck-tbl-row .cx {
  font: 400 16px/1.35 var(--deck-font-text);
  color: var(--deck-text);
}
.deck-tbl-row .cx.muted {
  color: var(--deck-muted);
}
/* compact variant for tables of 7+ rows */
.deck-slide.table.dense .deck-tbl-h {
  font-size: 30px;
  margin-bottom: 18px;
}
.deck-slide.table.dense .deck-tbl-head {
  padding-bottom: 10px;
}
.deck-slide.table.dense .deck-tbl-body {
  gap: 6px;
}
.deck-slide.table.dense .deck-tbl-row {
  padding: 9px 18px;
  border-radius: 8px;
}
.deck-slide.table.dense .deck-tbl-row .c0 {
  font-size: 15px;
}
.deck-slide.table.dense .deck-tbl-row .cx {
  font-size: 14px;
}

/* ── 10 code ── */
.deck-slide.code {
  padding: 40px 56px 32px;
}
.deck-code-h {
  font: 600 38px var(--deck-font-display);
  margin: 0;
}
.deck-code-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 0 8px;
}
.deck-term {
  width: 920px;
  max-height: 100%;
  background: var(--deck-term-bg, #0a0c10);
  border: 1px solid var(--deck-line);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 24px 60px var(--deck-term-shadow, rgba(0, 0, 0, 0.5));
  display: flex;
  flex-direction: column;
}
.deck-term-bar {
  height: 44px;
  flex: none;
  background: var(--deck-surface);
  border-bottom: 1px solid var(--deck-line);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 18px;
}
.deck-term-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--deck-surface-2);
  border: 1px solid var(--deck-line);
}
.deck-term-name {
  font: 500 14px var(--deck-font-mono);
  color: var(--deck-dim);
  margin-left: 12px;
}
.deck-term-body {
  margin: 0;
  padding: 26px 30px;
  font: 400 17px/1.7 var(--deck-font-mono);
  color: var(--deck-term-text, var(--deck-text));
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.deck-term-body .cmt {
  color: var(--deck-dim);
}
.deck-code-cap {
  font: 400 15px var(--deck-font-mono);
  color: var(--deck-dim);
  text-align: center;
  flex: none;
}

/* ── 11 qa ── */
.deck-slide.qa {
  padding: 44px 56px;
}
.deck-qa-head {

  align-items: center;

}
.deck-seg {

.deck-qa-list {

}
.deck-qacat {

}

}
.deck-qacat-head {

.deck-qacat-title {

.deck-qacat-count {

.deck-qacat-body {

.deck-qab-q {

}
.deck-qab-short {

  color: var(--deck-text);
}
/* contrast: the regular answer text is muted and thin, keywords are bright and bold */
.deck-qab-short.has-q {

}
.deck-qab-short p {

}
.deck-qab-short strong {

  font-weight: 700;
}
.deck-qab-more {
  font: 400 17px var(--deck-font-text);
  color: var(--deck-accent);

  padding: 8px 0 0;
}
.deck-qab-det {

}

/* ordered */
.deck-qao {
  background: var(--deck-surface);

}

}

}

.deck-qao-live {

  border: 1px solid var(--deck-live-tint-border, rgba(94, 168, 255, 0.4));

  padding: 4px 12px;
  margin-left: auto;
  flex: none;
  white-space: nowrap;
}
.deck-qao-chev {
  font: 500 12px var(--deck-font-mono);
  color: var(--deck-dim);
  margin-left: auto;
  flex: none;
}
.deck-qao-panel {
  margin-top: 10px;
  padding-left: 50px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.deck-qao-catname {
  font: 500 12px var(--deck-font-mono);
  color: var(--deck-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 0;
}

/* ── 12 offer ── */
.deck-slide.offer {
  padding: 64px 56px 36px; /* top: do not go under the Brief/Detailed toggle */
}
.deck-offer-kicker {
  font: 500 15px var(--deck-font-mono);
  color: var(--deck-accent);
  letter-spacing: 0.16em;
  margin-bottom: 18px;
}
.deck-offer-packs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  max-width: 920px;
  width: 100%;
  margin: 0 auto;
}
.deck-offer-packs.n-1 {
  grid-template-columns: minmax(0, 460px);
  justify-content: center;
}
.deck-offer-packs.n-3 {
  grid-template-columns: 1fr 1fr 1fr;
  max-width: 100%;
}
.deck-pack {
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  border-radius: 16px;
  padding: 30px 34px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  min-width: 0; /* do not push the grid out of the canvas with long content */
}
.deck-pack.hot {
  background: var(--deck-accent-soft);
  border: 1.5px solid var(--deck-accent);
}
.deck-pack-name {
  font: 600 16px var(--deck-font-mono);
  letter-spacing: 0.14em;
  color: var(--deck-muted);
}
.deck-pack.hot .deck-pack-name {

}
.deck-pack-price {

}
.deck-pack-features {

}
.deck-pack-features li {
  font: 400 17px/1.4 var(--deck-font-text);
  color: var(--deck-muted);
}
.deck-pack-cta {
  margin-top: auto;
  font: 600 19px var(--deck-font-text);
  text-align: center;
  text-decoration: none;
  border-radius: 10px;
  padding: 15px;
  cursor: pointer;
  border: 1.5px solid var(--deck-text);
  color: var(--deck-text);
  background: transparent;
}
.deck-pack-cta:hover {
  border-color: var(--deck-accent);
  color: var(--deck-accent);
}
.deck-pack.hot .deck-pack-cta {
  border: none;
  background: var(--deck-accent);
  color: var(--deck-accent-ink);
}
.deck-pack.hot .deck-pack-cta:hover {
  filter: brightness(1.08);
  color: var(--deck-accent-ink);
}
.deck-offer-bullets {
  list-style: none;
  margin: 14px auto 0;
  padding: 0;
  max-width: 920px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
}
.deck-offer-bullets li {

}
.deck-offer-foot {

  justify-content: center;

  font: 400 15px var(--deck-font-mono);

}
.deck-offer-foot .accent {

}
.deck-offer-foot .dot {

}

/* ── image-placeholder ── */
.deck-imgph {
  border: 1.5px dashed var(--deck-line);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.deck-imgph-top {
  display: flex;
  gap: 8px;
  align-items: center;
}
.deck-imgph-icon {
  font-size: 16px;
}
.deck-imgph-label {
  font: 600 11px var(--deck-font-mono);
  color: var(--deck-muted);
  letter-spacing: 0.1em;
}
.deck-imgph-prompt {
  margin: 0;
  font: 400 11px/1.5 var(--deck-font-mono);
  color: var(--deck-dim);
}
.deck-imgph-copy {
  align-self: flex-start;
  font: 500 11px var(--deck-font-mono);
  background: var(--deck-surface);
  color: var(--deck-accent);
  border: 1px solid var(--deck-line);

}

}
.deck-img {

/* ── fallback ── */
.deck-slide.fallback {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 90px;
}
.deck-fallback-badge {
  font: 500 12px var(--deck-font-mono);
  color: var(--deck-bad);
  background: var(--deck-badge-tint, rgba(255, 107, 107, 0.12));
  border: 1px solid var(--deck-badge-tint-border, rgba(255, 107, 107, 0.4));
  border-radius: 999px;
  padding: 4px 12px;
  margin-bottom: 16px;
}
.deck-fallback-h {
  font: 600 44px var(--deck-font-display);
  margin: 0;
}

/* ── NOTES-WINDOW-CSS-START ── */
/* ── prompter panel (Detailed mode, OUTSIDE the canvas) ── */
.deck-pp {
  flex: calc(100 - var(--deck-speaker-split)) 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--deck-accent);
  background: var(--deck-surface);
  border-radius: 14px;
}
/* A mirror of the canvas `.deck-canvas strong`, but with one deliberate difference: the weight of the browser
 * default is NOT suppressed here. On the canvas `**` means color and only color; in the panel the presenter
 * reads under load and with peripheral vision, so redundant coding is useful — color
 * plus weight hold the mark when the color is eaten by the projector. */
.deck-pp strong {
  color: var(--deck-pp-key);
}
/* Inline code in the panel is distinguished by SHAPE, not by color: the color channel in the prompter is taken
 * by the mark, and two different markers in one color would read as one. The backing + border
 * (on a dark background a backing alone is not readable) plus the monospace size from the shared rule
 * give the sense of a literal, without claiming the anchor channel. The color is inherited from the text, so
 * code inside a mark moves away together with it. */
.deck-pp .deck-ic {
  background: var(--deck-surface-2);
  border: 1px solid var(--deck-line);
  border-radius: 4px;
  padding: 0 4px;
}
.deck-pp-bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--deck-line);
}
.deck-pp-label {
  font: 700 12px var(--deck-font-mono);
  color: var(--deck-accent);
  letter-spacing: 0.14em;
}
.deck-pp-subnote {
  font: 400 12px var(--deck-font-mono);
  color: var(--deck-dim);
}
.deck-pp-tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.deck-pp-fbtn {
  font: 700 14px var(--deck-font-mono);
  background: var(--deck-surface-2);
  color: var(--deck-text);
  border: 1px solid var(--deck-line);
  border-radius: 7px;
  padding: 5px 12px;
  cursor: pointer;
}
.deck-pp-fbtn:hover:not(:disabled) {
  border-color: var(--deck-accent);
}
.deck-pp-fbtn:disabled {
  opacity: 0.4;
  cursor: default;
}
.deck-pp-fpx {
  font: 500 12px var(--deck-font-mono);
  color: var(--deck-muted);
  min-width: 40px;
  text-align: center;
}
.deck-pp-collapse {
  font: 500 12px var(--deck-font-mono);
  color: var(--deck-dim);
  background: transparent;
  border: 0;
  cursor: pointer;
  margin-left: 8px;
}
.deck-pp-collapse:hover {
  color: var(--deck-text);
}
/* The prompter body font size lived in the EXPORT_CSS constant of the exporter itself, that is OUTSIDE the marked
 * piece: the notes window would inherit all the panel rules except the font size, and would diverge
 * from the deck exactly on it — silently. The place for the rule is here, inside the markers. */
.deck-pp-body {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: 26px;
  padding: 20px 28px;
  overflow: auto;
  font-size: 15px;
}
.deck-pp-col {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.deck-pp-col.c-say {
  flex: 1.2;
}
.deck-pp-col.c-ask {
  flex: 1.1;
}
.deck-pp-col.c-thes {
  flex: 1.1;
}
.deck-pp-col.c-mat {
  flex: 0.9;
}
/* The subsection label is a SEPARATOR, not a caption: weight and line give the block boundary, which is
 * seen before the word is read. The color is raised from --deck-dim (2.85 against the panel background —
 * a line of such a tone is not readable at all) to --deck-muted, but remains dimmer than the base
 * text: service markup must not draw attention away from the content. */
.deck-pp-collabel {
  font: 700 11px var(--deck-font-mono);
  color: var(--deck-muted);
  letter-spacing: 0.14em;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--deck-line);
}
.deck-pp-say {
  line-height: 1.5;
  color: var(--deck-pp-text);
}
.deck-pp-say.crit {
  background: var(--deck-accent-soft);
  border: 1px solid var(--deck-accent);
  border-radius: 10px;
  padding: 10px 14px;
}
.deck-pp-chip {
  align-self: flex-start;
  line-height: 1.4;
  color: var(--deck-pp-text);
  background: var(--deck-surface-2);
  border: 1px solid var(--deck-line);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  text-align: left;
  font: inherit;
}
.deck-pp-chip.open {
  border-color: var(--deck-accent);
}
.deck-pp-ans {
  line-height: 1.55;
  color: var(--deck-muted);
}
.deck-pp-ans p {
  margin: 0.3em 0;
}
.deck-pp-thes {
  line-height: 1.5;
  color: var(--deck-pp-text);
}
.deck-pp-thes .src {
  font-family: var(--deck-font-mono);
  font-size: 0.8em;
  color: var(--deck-dim);
}
.deck-pp-thes a {
  color: var(--deck-accent);
  text-decoration: none;
}
.deck-pp-mat {
  line-height: 1.4;
  color: var(--deck-accent);
  text-decoration: none;
}
.deck-pp-mat:hover {
  text-decoration: underline;
}

/* ── chrome of the presenter notes window (second browser window) ──
 * The rules lie HERE, not inline in the runtime, for the same reason that the body font size of the prompter
 * got here: the window shows the same panel as the deck, and two descriptions of one
 * view must not diverge. In the deck window itself there are no .deck-notes-* nodes — for it these are
 * dead rules, like the side/overlay layouts for the audience.
 * Scope marker — the data-notes attribute on .deck-root: it exists only in the notes window. */
.deck-root[data-notes] {
  padding: 14px 16px;
  gap: 12px;
}
.deck-notes-head {
  flex: none;
  display: flex;
  align-items: baseline;
  gap: 12px;
  font: 500 13px var(--deck-font-mono);
  color: var(--deck-muted);
}
.deck-notes-no {
  flex: none;
  color: var(--deck-text);
}
.deck-notes-sec {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* The connection status line. While the connection exists — a dim service caption; when the deck is closed,
 * it is the main message of the window, so the color is a status one: the presenter must tell apart: the notes
 * froze because I am not paging versus the notes froze because the deck is gone. */
.deck-notes-link {
  margin-left: auto;
  flex: none;
  color: var(--deck-dim);
}
.deck-notes-link.lost {
  color: var(--deck-bad);
}
/* The only scroller of the window: the header, the frame counter, four subsections and next
 * scroll together. There is deliberately no nested scrolling — the presenter reads top to bottom,
 * and two independent scrolls would make them look for which one is currently under the cursor.
 * tabindex is set by the runtime: without focus the arrows ↑/↓ and Space have nothing to scroll. */
.deck-notes-scroll {
  flex: 1 1 0;
  min-height: 0;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  outline: none;
}
.deck-notes-title {
  flex: none;
  font: 600 22px/1.25 var(--deck-font-display);
  color: var(--deck-text);
}
.deck-notes-step {
  flex: none;
  font: 500 12px var(--deck-font-mono);
  color: var(--deck-muted);
  letter-spacing: 0.08em;
}
/* The frame counter node ALWAYS exists — its text is patched by a targeted redraw, and it must find
 * it in the markup without branching. On a screen without frames it is empty and therefore hidden:
 * otherwise an empty line would take the column gap for itself. */
.deck-notes-step:empty {
  display: none;
}
/* A screen without notes is not an empty window: the frame stays, and the emptiness is covered by an explicit line.
 * The presenter reads an empty window as a lost connection and goes to check, instead of presenting. */
.deck-notes-none {
  flex: none;
  font: 400 14px var(--deck-font-text);
  color: var(--deck-dim);
}
.deck-notes-next {
  flex: none;
  padding-top: 10px;
  border-top: 1px solid var(--deck-line);
  font: 400 13px var(--deck-font-text);
  color: var(--deck-dim);
}
/* In the window the panel does NOT share the area with the canvas — so it needs no share either: height by
 * content, the space is provided by the shared scroller. The four subsections go in a column, not in a row:
 * the presenter window is narrow and tall, and four columns in it would turn into four slits. */
.deck-root[data-notes] .deck-pp {
  flex: none;
  border-radius: 12px;
}
.deck-root[data-notes] .deck-pp-body {
  flex-direction: column;
  overflow: visible;
  gap: 18px;
}
/* The section timer in the notes window is a SEPARATE line, not a fourth element of the header.
 * The window header is a row of narrow-column width, and the caption remaining of 16 min would squeeze in it
 * everything else; and the presenter must watch this number out of the corner of the eye, without reading — hence
 * the large font size and monospace digits with tabular zeros (without them the line jitters on every
 * second and draws the eye exactly when it should not). */
.deck-notes-clock {
  flex: none;
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 12px;
  border: 1px solid var(--deck-line);
  border-radius: 12px;
  background: var(--deck-surface);
}
.deck-notes-clock-v {
  flex: none;
  font: 600 28px/1 var(--deck-font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--deck-text);
}
.deck-notes-clock-l {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font: 500 12px var(--deck-font-mono);
  color: var(--deck-muted);
}
/* Overflow is NOT hidden: after zero the count goes negative and is marked. It matters more to the presenter to know,
 * BY HOW MUCH they ran over than to see a stopped zero — what to cut next depends on it.
 * The state is distinguishable by color AND by word at once: an overrun cannot be told by color alone, and color is read
 * faster than a word — both are needed. */
.deck-notes-clock[data-state='over'] {
  border-color: var(--deck-bad);
}
.deck-notes-clock[data-state='over'] .deck-notes-clock-v,
.deck-notes-clock[data-state='over'] .deck-notes-clock-l {
  color: var(--deck-bad);
}
/* A section without a parsed time: the counter stays, but counts FORWARD and says so with
 * a caption. A silent absence of the counter would be read by the presenter as a breakage and they would go
 * check instead of presenting. */
.deck-notes-clock[data-state='free'] .deck-notes-clock-v {
  color: var(--deck-muted);
}
/* The budget was read UNCERTAINLY (the line has several numbers, it does not read as an interval, the
 * first one is taken: from 8 to 24 → 8, although the person meant 16). The count runs — throwing away a probably
 * correct number would be worse — but it does not pretend to be exact: a dashed border plus the ≈ sign
 * and words in the caption, which the runtime sets. The marker is a separate attribute, not a value of
 * `data-state`: an overrun must stay an overrun both by color and by word. */
.deck-notes-clock[data-loose] {
  border-style: dashed;
}
/* ── NOTES-WINDOW-CSS-END ── */

/* ── status line (under the slide) ── */
.deck-status {
  /* Anchor for the notes call button: it is NOT in the row, but above its right edge — that is
   * in the bottom right corner of the deck window (see .deck-notes-btn). Binding to the line itself keeps it
   * exactly above the row at any of its heights; counting from the bottom of the window would drift from the row at
   * the very first edit of the font size or padding. */
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 2px 10px 0;
}
.deck-status-no {
  font: 500 14px var(--deck-font-mono);
  color: var(--deck-text);
}
.deck-status-type {
  font: 500 13px var(--deck-font-mono);
  color: var(--deck-accent);
}
.deck-status-hint {
  margin-left: auto;
  font: 400 12px var(--deck-font-mono);
  color: var(--deck-dim);
}
/* prompter toggle in the status line (speaker export): outside the shared canvas */
.deck-status-prompter {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 20px;
}
.deck-status-plabel {
  font: 500 11px var(--deck-font-mono);
  color: var(--deck-accent);
  letter-spacing: 0.14em;
}
.deck-status-prompter button {
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  color: var(--deck-muted);
  border-radius: 999px;
  padding: 3px 14px;
  font: 500 12px var(--deck-font-text);
  cursor: pointer;
}
.deck-status-prompter button.on {
  background: var(--deck-accent);
  border-color: var(--deck-accent);
  color: var(--deck-accent-ink, #0b0d11);
}
.deck-status-prompter button:disabled {
  opacity: 0.35;
  cursor: default;
}
/* The button that moves the prompter into a second window (speaker export) — a small rectangle in the right
 * bottom corner of the deck window. The runtime keeps it in the status line markup, but IT IS NOT IN THE ROW:
 * `position: absolute` takes it out of the flow, so it does not share the row width and does not set its height
 * for it, that is it does not affect `--deck-fit` at all. Earlier the button lay in the row and was its
 * longest element there — its caption saying the browser blocked the window had to be protected from
 * shrinking by a separate rule; in the corner this caption is safe and wraps onto two lines.
 * `bottom: 100%` is counted from the line ITSELF: the button stands above the row at any of its heights
 * and does not run onto the time counter occupying the right edge of the row. Counting from the bottom of the window
 * would have to be recalculated after every edit of the font size in the line.
 * While the notes window is connected, there is no button at all — the runtime removes it; it is visible exactly when
 * it solves a task (notes were not opened or the window got orphaned after a deck reload).
 * `z-index` above any canvas layer, otherwise the slide picture would cover the button. */
.deck-notes-btn {
  position: absolute;
  right: 10px;
  bottom: 100%;
  margin-bottom: 6px;
  z-index: 20;
  max-width: 42%;
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  color: var(--deck-muted);
  border-radius: 6px;
  padding: 2px 8px;
  font: 500 11px var(--deck-font-text);
  line-height: 1.35;
  text-align: right;
  cursor: pointer;
}
.deck-notes-btn:hover {
  border-color: var(--deck-accent);
  color: var(--deck-text);
}
/* A browser refusal is not a highlight but a message: the tone is a status one, so that the presenter sees it
 * with peripheral vision and does not guess why the click did nothing. */
.deck-notes-btn[data-state='blocked'],
.deck-notes-btn[data-state='denied'] {
  border-color: var(--deck-bad);
  color: var(--deck-bad);
}
/* The section timer in the deck itself. One node, not a toggle plus value pair: the status line
 * row is squeezed anyway, and a second element would take space from the screen caption. The button
 * itself is the indicator — when off it prints its name, when on the remaining time.
 * OFF BY DEFAULT in both modes, and this is not thrift: the deck window is what the presenter
 * shares with the room, so nothing that depends on the run time gets there until they
 * ask for it themselves. The width does not jump: nowrap plus tabular digits (`font-variant-numeric`
 * goes AFTER the `font` shorthand — it resets it to normal).
 *
 * THE HEIGHT IS PINNED ON PURPOSE, and this is not cosmetics. The status line is a flex row, whose height
 * the CANVAS takes for itself: an element taller than its neighbors reduces `--deck-fit`, that is the picture size
 * on screen would depend on the appearance of a chrome button. Exactly this happened in the first edition — the row
 * of the hall export, where there are no buttons at all, grew from 18 to 26 px, and the byte-level DOM gate `.deck-main`
 * went red on the inline `--deck-fit`. The sum 12 (line-height) + 0 (padding) + 2 (border) =
 * 14 px, and the tallest neighbor (`.deck-status-no`) is 16 px.
 * THERE IS NO VERTICAL PADDING PRECISELY FOR THIS REASON. With it the sum gave exactly 16 — tight, and the invariant
 * that the button is not taller than its neighbors would hold not on arithmetic but on FONT METRICS: a height of 16 px
 * on the neighbor is a 14 px font size at `line-height: normal`, that is ≥ 1.143, and the font is set by a
 * user style package. If it gives less — the button becomes the tallest element
 * of the row, the row grows, the canvas scale drifts. Two pixels of margin are bought for free: the row
 * is center-aligned, so the look of the button does not change from the removed padding, and the row height
 * (18 px in the hall one, 25 in speaker) stays the same — measured in both modes.
 * This is edited only together: if you touched the font size or padding — recalculate the sum and the margin. */
.deck-status-clock {
  flex: none;
  margin-left: 12px;
  white-space: nowrap;
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  color: var(--deck-dim);
  border-radius: 999px;
  padding: 0 10px;
  font: 500 12px var(--deck-font-mono);
  font-variant-numeric: tabular-nums;
  line-height: 1;
  cursor: pointer;
}
.deck-status-clock:hover {
  border-color: var(--deck-accent);
  color: var(--deck-text);
}
.deck-status-clock[data-state='run'] {
  border-color: var(--deck-accent);
  color: var(--deck-accent);
}
.deck-status-clock[data-state='over'] {
  border-color: var(--deck-bad);
  color: var(--deck-bad);
}
.deck-status-clock[data-state='free'] {
  color: var(--deck-muted);
}
/* An uncertainly read budget — a dashed border (see the same marker on the counter in the window).
 * The border thickness does not change, so the button height stays exactly 16 px and the row does not move. */
.deck-status-clock[data-loose] {
  border-style: dashed;
}
.deck-status-home {
  font-size: 16px;
  color: var(--deck-muted);
  text-decoration: none;
}
.deck-status-home:hover {
  color: var(--deck-accent);
}

/* ── empty deck ── */
.deck-empty {
  margin: auto;
  text-align: center;
  color: var(--deck-dim);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.deck-empty b {
  color: var(--deck-text);
  font-size: 1.3rem;
}

/* base rich-text list (in the panel/qa) */
.deck-ul {
  margin: 0.3em 0;
  padding-left: 1.2em;
}
.deck-ul li {
  margin-bottom: 0.25em;
}
/* deckfeatai engine E3 — appearance steps, morphing, island frame.
 *
 * The ONLY E3 CSS of the engine: the rules of steps, morph, islands and reduced-motion live
 * only here. The factories of steps/morph/islands do not add their own styles — they use
 * the classes of this file.
 *
 * Place in the concatenation: AFTER the tail of deck.css and BEFORE the CSS of new/user types — so
 * the type style.css can override the island frame, and the style package tokens.css (it is glued in
 * even later) can override the motion tokens. The gluing is conditional: only for a deck that
 * actually uses E3.
 *
 * The rules of this file:
 *   — not a single color or font literal: color and font only via var(--deck-*);
 *   — ONLY transform and opacity are animated (perf contract); values computed
 *     at runtime (FLIP deltas of the morph) go through WAAPI, not from here;
 *   — the class `deck-step` is TAKEN by the base type `process` (its ladder of steps), so
 *     the step target is called `deck-step-el`. The trap is two-sided: a bare rule
 *     `.deck-step { … }` here would repaint the ladder, and a bare class `deck-step` on a target
 *     would drag onto it the background, border, `padding` and `display: flex` of the LADDER — the CSS of twelve
 *     base types is glued into every deck unconditionally and before this file. Hence:
 *     not a single rule on a bare `.deck-step`, and the target is addressed by its own name
 *     (`deck-step-el` combined with `[data-step]`) or by state markers
 *     (`deck-step-off` / `deck-step-current` / `deck-step-in`), which do not intersect with `process`.
 */

/* ── 1. motion tokens ─────────────────────────────────────────────────────────────
 * Scope — `.deck-canvas`: the style package overrides them with its tokens.css (same
 * specificity, it is glued later, the later one wins). The runtime reads them via
 * getComputedStyle(canvas).getPropertyValue('--deck-motion-<name>') and hands them to the factories
 * as env.motion.dur(name) — the factories do not go to the tokens by hand. */
.deck-canvas {
  --deck-motion-appear: 220ms;
  --deck-motion-morph: 1000ms;
  --deck-motion-stagger: 70ms;
  --deck-motion-ease: cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── 2. appearance steps ────────────────────────────────────────────────────────────
 * Markup of the step target (printed by the steps factory):
 *   class="deck-step-el" data-step="<n>" [data-step-exit="<m>"] style="--deck-step-i:<i>"
 * States:
 *   + deck-step-off      — the step has not come yet or has already gone (hidden);
 *   + deck-step-current  — exactly the current step k;
 *   + deck-step-in deck-step-in-<preset> — the entry animation, the class is removed on completion.
 */

/* The base of the step target. The class name is `deck-step-el`, not `deck-step`: the bare name is taken by the ladder
 * of the `process` type (see the file header). `[data-step]` in the selector is left on purpose — the rule
 * addresses exactly the target stamped by the factory. */
.deck-canvas .deck-step-el[data-step] {
  transition:
    opacity var(--deck-motion-appear) var(--deck-motion-ease),
    transform var(--deck-motion-appear) var(--deck-motion-ease);
}

/* Hidden step. We deliberately do NOT touch `display`: with display:none both the FLIP measurements
 * of the morph and the canvas overflow scanner break — hidden elements must stay measurable. */
.deck-canvas .deck-step-off {
  opacity: 0;
  pointer-events: none;
}

/* Pseudo-elements of the WRAPPER of a hidden step — suppressed separately, inheritance cannot reach them.
 *
 * The step target is the deepest node with the needed text (the resolver rule), and the list primitive
 * prints an item as `<li><span>text</span></li>`. So `opacity: 0` lands on the `span`,
 * while the item marker is drawn by the PARENT `li`: either by its own `::before` (a square at anchor, compare),
 * or by the native `::marker` from `list-style: disc` (tabs, widget). The transparency of the child does not reach
 * the pseudo-element of the parent — without these two rules at frame zero there is no text,
 * but the dots are lit.
 *
 * Two branches, because the mechanisms differ: `::before`/`::after` inherit opacity,
 * the native `::marker` does NOT, and is suppressed only by color (`transparent` here is not a palette color,
 * but the absence of one, so it needs no token). `::after` in the first branch is not about today:
 * no type draws an item decoration with it, but the rule must read as one phrase:
 * the pseudo-elements of the wrapper fade with the target, otherwise the author of a new type will step on the same joint.
 * The selector of both branches is `*`, not `li`: `::marker` is drawn for any `display: list-item` box,
 * and a wrapper decoration may also be outside a list.
 *
 * `:only-child` is the boundary of the rule: we suppress the decoration only of a wrapper inside which there is ONLY the
 * step target. If the item has a SECOND ELEMENT, it is partially visible, and without the marker it will shift along the grid.
 * The boundary is leaky in one direction, and it cannot be fixed here: `:only-child` counts only
 * elements, so `<li>Reason: <span>target</span></li>` falls under the rule — the marker
 * is suppressed, while the bare text is lit. CSS selectors do not see text nodes at all, and there is nothing to tell such an
 * item from a clean one; the duty that all the text of an item goes in one node is written into the contract
 * of the type (`../element-types/README.md`).
 *
 * THE DEPENDENCY ON `:has()` is the only one in the shipped CSS. A browser without it (Safari < 15.4,
 * Firefox < 121, Chrome/Edge < 105) will skip the rule, and the markers will be lit as before the fix:
 * a degradation to the previous behavior, not a broken screen. The floor is declared in `README.md` next to it.
 *
 * THE RETURN IS ABRUPT, AND THIS IS DELIBERATE. The rule removes itself: the shown step loses
 * `deck-step-off`, and `:has()` stops matching. But the marker returns INSTANTLY, while the text
 * flows in along the cascade, so the initial picture of dots without text lives for another ~0.25 s
 * (stagger × index + appearance time). It is not synchronized cheaply: `::marker` is suppressed by COLOR,
 * and a transition on `color` is forbidden by the perf contract (`scripts/tests/e3-motion-specificity`
 * allows only `transform` and `opacity`), the cascade index `--deck-step-i` lives on the TARGET,
 * that is on the CHILD, and is unavailable to the pseudo-element of the wrapper — inheritance goes downward. A flicker
 * for a quarter of a second instead of permanently lit dots is an accepted trade-off, not an oversight. */
.deck-canvas *:has(> .deck-step-off:only-child)::before,
.deck-canvas *:has(> .deck-step-off:only-child)::after {
  opacity: 0;
}
.deck-canvas *:has(> .deck-step-off:only-child)::marker {
  color: transparent;
}

/* The current step is a hook for the style package and the CSS of a type. The engine guarantees only visibility;
 * decorative highlighting of the attention point is a matter of style, not of the engine. */
.deck-canvas .deck-step-current {
  opacity: 1;
}

/* Entry. Cascade — the target index (--deck-step-i) × --deck-motion-stagger.
 * will-change lives exactly for the duration of the animation: the entry class is removed on animationend.
 * Gotcha for the runtime: the preset `none` gives no animationend (animation-name: none) —
 * there the entry class is removed immediately, not on the event. */
.deck-canvas .deck-step-in {
  animation-duration: var(--deck-motion-appear);
  animation-timing-function: var(--deck-motion-ease);
  animation-delay: calc(var(--deck-step-i, 0) * var(--deck-motion-stagger));
  animation-fill-mode: both;
  will-change: transform, opacity;
}

/* Seven appearance presets — a closed enum none|fade|up|down|left|right|scale.
 * The flight distance is a literal: the canvas is fixed (1200×675), there is nothing to scale the shift
 * with, and we do not extend the E3 contract with a fifth motion token. */
.deck-canvas .deck-step-in-none {
  animation-name: none;
}
.deck-canvas .deck-step-in-fade {
  animation-name: deck-step-fade;
}
.deck-canvas .deck-step-in-up {
  animation-name: deck-step-up;
}
.deck-canvas .deck-step-in-down {
  animation-name: deck-step-down;
}
.deck-canvas .deck-step-in-left {
  animation-name: deck-step-left;
}
.deck-canvas .deck-step-in-right {
  animation-name: deck-step-right;
}
.deck-canvas .deck-step-in-scale {
  animation-name: deck-step-scale;
}

@keyframes deck-step-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes deck-step-up {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes deck-step-down {
  from {
    opacity: 0;
    transform: translateY(-14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes deck-step-left {
  from {
    opacity: 0;
    transform: translateX(14px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
@keyframes deck-step-right {
  from {
    opacity: 0;
    transform: translateX(-14px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
@keyframes deck-step-scale {
  from {
    opacity: 0;
    transform: scale(0.96);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* ── 3. morphing ───────────────────────────────────────────────────────────────────
 * Departing unmatched nodes are moved LIVE (without cloning — a clone loses
 * the island state) into the orphan layer. The layer lies in `.deck-canvas-area`, and NOT inside
 * the canvas: `elCanvas.innerHTML = …` would wipe it together with the content.
 *
 * The layer geometry repeats `.deck-canvas` one to one — otherwise the moved nodes will drift away:
 * they are positioned in canvas coordinates. IMPORTANT for the morph factory: `--deck-fit`
 * is set by the runtime INLINE on the canvas itself, so the default
 * unit from `.deck-root` arrives here by inheritance. When creating the layer, the factory must copy onto it the current
 * `--deck-fit` value of the canvas, otherwise the layer will not match it in scale. */
.deck-morph-orphans {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1200px;
  height: 675px;
  border-radius: 16px;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
  transform: translate(-50%, -50%) scale(var(--deck-fit, 1));
  transform-origin: center center;
}

/* The moved node takes absolute canvas coordinates — they are set by the factory
 * from the getBoundingClientRect() snapshot taken BEFORE the redraw. */
.deck-morph-orphans > * {
  position: absolute;
  margin: 0;
}

/* Unmatched INCOMING nodes — a fade: 0.8× of the morph duration, 0.2× of the delay. */
.deck-canvas .deck-morph-fade {
  animation-name: deck-step-fade;
  animation-duration: calc(var(--deck-motion-morph) * 0.8);
  animation-timing-function: var(--deck-motion-ease);
  animation-delay: calc(var(--deck-motion-morph) * 0.2);
  animation-fill-mode: both;
  will-change: opacity;
}

/* ── 4. island frame ───────────────────────────────────────────────────────────────
 * Island markup:   class="deck-island" data-island="<key>" data-state='<json>'
 * Action markup:  data-act="e3" data-island="<key>" (data-set='<json>' | data-toggle="<field>")
 *
 * Here — only a neutral frame: the container, expansion states and three base
 * controls (button / row / panel). Decor is the business of the type style.css: it is glued in
 * later and overrides these rules. No color or font is set by a literal. */
.deck-canvas .deck-island {
  display: block;
  min-width: 0;
}

/* Any carrier of a generic action is clickable — the type need not remember about cursor. */
.deck-canvas [data-act='e3'] {
  cursor: pointer;
}
.deck-canvas [data-act='e3']:focus-visible {
  outline: 2px solid var(--deck-accent);
  outline-offset: 2px;
}

/* Button. */
.deck-canvas .deck-island-btn {
  font: 500 14px/1.2 var(--deck-font-text);
  color: var(--deck-text);
  background: var(--deck-surface);
  border: 1px solid var(--deck-line);
  border-radius: 10px;
  padding: 8px 14px;
  cursor: pointer;
}
.deck-canvas .deck-island-btn:hover {
  background: var(--deck-surface-2);
}
/* The selected state of a control (the active tab, etc.). */
.deck-canvas .deck-island-btn.deck-island-on {
  background: var(--deck-accent-soft);
  border-color: var(--deck-accent);
  color: var(--deck-accent);
}

/* A clickable row (a table with expansions, an accordion). */
.deck-canvas .deck-island-row {
  cursor: pointer;
}
.deck-canvas .deck-island-row:hover {
  background: var(--deck-surface-2);
}
.deck-canvas .deck-island-row.deck-island-open {
  background: var(--deck-accent-glow);
}

/* The expansion panel: collapsed by default, expanded by the marker `deck-island-open`
 * on the parent (accordion) or on the previous sibling (table row).
 * `display:none` is safe and deliberate here: it hides the DISPLAY, but not the markup — the static
 * facade, print, PPTX and video read the content from innerHTML, not from visibility.
 * A type that needs a non-block display (for example `table-row`) only has to set
 * `--deck-island-panel-display` — there is no need to override the selector itself. */
.deck-canvas .deck-island-panel {
  display: none;
  font: 400 13px/1.4 var(--deck-font-text);
  color: var(--deck-muted);
}
.deck-canvas .deck-island-open > .deck-island-panel,
.deck-canvas .deck-island-open + .deck-island-panel {
  display: var(--deck-island-panel-display, block);
}

/* ── 5. reduced-motion — TWO INDEPENDENT layers ─────────────────────────────────────
 * The layers are deliberately duplicated and not merged into one selector list: one must
 * live inside @media, the other outside.
 *
 *   layer 1 (CSS, works WITHOUT any JS): @media (prefers-reduced-motion: reduce)
 *     with the selector `.deck-root .deck-canvas` — specificity (0,2,0) is higher than that of
 *     the style package `.deck-canvas` (0,1,0), which is glued in LATER; a bare
 *     `.deck-canvas` here would lose to the style, and accessibility would turn out to be switchable off;
 *   layer 2 (runtime, catches a change of the system setting on the fly): the runtime sets
 *     `data-reduced-motion="1"` on `.deck-root`, the selector (0,3,0) overrides both the style
 *     and layer 1.
 *
 * Durations → 0.01ms, and NOT 0: a zero duration does not produce transitionend /
 * animationend, and the step state machines and the morph cleanup rely on these events.
 * Flights (up/down/left/right/scale) are replaced with a fade; the presets `none` and `fade`
 * stay themselves. */

/* layer 1 — CSS, without JS involvement */
@media (prefers-reduced-motion: reduce) {
  .deck-root .deck-canvas {
    --deck-motion-appear: 0.01ms;
    --deck-motion-morph: 0.01ms;
    --deck-motion-stagger: 0.01ms;
  }
  .deck-root .deck-canvas .deck-step-in-up,
  .deck-root .deck-canvas .deck-step-in-down,
  .deck-root .deck-canvas .deck-step-in-left,
  .deck-root .deck-canvas .deck-step-in-right,
  .deck-root .deck-canvas .deck-step-in-scale {
    animation-name: deck-step-fade;
  }
  .deck-root .deck-canvas,
  .deck-root .deck-canvas *,
  .deck-root .deck-canvas *::before,
  .deck-root .deck-canvas *::after,
  .deck-root .deck-morph-orphans,
  .deck-root .deck-morph-orphans * {
    animation-duration: 0.01ms !important;
    animation-delay: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0.01ms !important;
  }
}

/* layer 2 — runtime; the same set of selectors, reinforced by an attribute on `.deck-root` */
.deck-root[data-reduced-motion='1'] .deck-canvas {
  --deck-motion-appear: 0.01ms;
  --deck-motion-morph: 0.01ms;
  --deck-motion-stagger: 0.01ms;
}
.deck-root[data-reduced-motion='1'] .deck-canvas .deck-step-in-up,
.deck-root[data-reduced-motion='1'] .deck-canvas .deck-step-in-down,
.deck-root[data-reduced-motion='1'] .deck-canvas .deck-step-in-left,
.deck-root[data-reduced-motion='1'] .deck-canvas .deck-step-in-right,
.deck-root[data-reduced-motion='1'] .deck-canvas .deck-step-in-scale {
  animation-name: deck-step-fade;
}
.deck-root[data-reduced-motion='1'] .deck-canvas,
.deck-root[data-reduced-motion='1'] .deck-canvas *,
.deck-root[data-reduced-motion='1'] .deck-canvas *::before,
.deck-root[data-reduced-motion='1'] .deck-canvas *::after,
.deck-root[data-reduced-motion='1'] .deck-morph-orphans,
.deck-root[data-reduced-motion='1'] .deck-morph-orphans * {
  animation-duration: 0.01ms !important;
  animation-delay: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
  transition-delay: 0.01ms !important;
}
