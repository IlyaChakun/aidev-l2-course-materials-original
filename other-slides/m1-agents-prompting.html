   * already contains the slide id, it will not see foreign state), but DETERMINISM: came back to the slide —
   * calculator at default, disclosures collapsed, steps from zero. The same requirement as for
   * programmatic frame rendering: a frame must depend only on the requested state,
   * not on what the viewer clicked on this slide ten minutes ago. */
  function resetTransient() {
    st.qaTab = 'topics'
    st.openCat = {}
    st.openB = {}
    st.openOrd = {}
    st.openHint = {}
    st.step = 0
    st.stepSeen = 0
    st.islands = {}
    st.focusIsland = null
    st.queued = null
    cancelFocusExit() // the deferred flag removal along with it: nothing left to turn off
    pendingMorph = null
    /* Leaving a slide also removes the preview layer markup: addresses refer to the payload of exactly this
     * slide, and a mark that survived the change would address a comment into foreign JSON. The post-pass
     * will put it back after the redraw. */
    if (INSPECTOR) INSPECTOR.detach()
  }

  /* The morph start gate is a PURE function of the fields of two slides and mode flags, without DOM:
   * only that way is its contract (when morph runs and when not) checked by a test without bringing up
   * a browser. Enabling conditions: both morph maps are objects and their `group` matched. Disabling
   * conditions: reduced-motion, frame capture mode, preview mode.
   * The call site stands apart from the function: morph is taken ONLY in go() and only on an
   * actual slide change, so all other redraw paths (delegate click, hashchange,
   * programmatic render) give a null snapshot — otherwise a click on an island tab would start morphing
   * the slide into itself. */
  function morphAllowed(from, to, flags) {
    var f = flags || {}
    if (f.reduced || f.capture || f.inspector) return false
    var a = isE3Obj(from && from.morph) ? from.morph : null
    var b = isE3Obj(to && to.morph) ? to.morph : null
    /* A group must be DECLARED and non-empty: a falsy value (`''`, `0`, absent field)
     * is treated as no group. Otherwise two slides whose field was simply forgotten would stick
     * into a morph pair by matching emptiness. */
    if (!a || !b || !a.group || !b.group) return false
    return String(a.group) === String(b.group)
  }

  /* `opts.defer` — we change the state, render() is left to the caller: paths that
   * bring the state up right after a slide change need ONE redraw, not two.
   * `opts.morph === false` — programmatic path: we do not take a snapshot at all, the frame must be
   * static. */
  function go(i, opts) {
    var o = opts || {}
    var n = Math.min(Math.max(i, 0), slides.length - 1)
    if (n === st.idx) {
      /* Jump to a slide where the deck ALREADY stands: `End` on the last slide, `Home` on the first,
       * the timeline dot of the current slide, a section whose first slide is open. The index does not change,
       * but the promise of a jump is slide opened from frame zero, and this path must keep it too:
       * otherwise on the last slide `End` would leave the frame scrolled through, and on the first
       * `Home` — half-open.
       *
       * `i === n` separates a REQUESTED jump from a CLAMP and is therefore mandatory: the step wrapper
       * forward, when frames are exhausted, calls this same function with the NEXT index, and on the last
       * slide it is clamped to the current one. Without the check that exactly this index was asked for, the forward arrow
       * on the last frame of the last slide would flip the slide BACK to frame zero instead of
       * an honest nowhere further.
       *
       * Everything else the early exit preserves, and this is not an optimization but a contract: when
       * there is nothing to reset, there is neither a redraw nor a reset of island and prompter state —
       * the idempotency of the deck API stands on this (same state → same DOM). */
      if (i === n && st.step !== 0) {
        st.step = 0
        st.stepSeen = 0
        if (!o.defer) render()
      }
      return
    }
    var from = slides[st.idx]
    var to = slides[n]
    st.idx = n
    /* resetTransient() also zeroes pendingMorph (insurance against an interrupted morph),
     * so a fresh snapshot is taken AFTER it — and from the NOT YET ERASED DOM of the outgoing slide. */
    resetTransient()
    var mo = buildMotion()
    E3ENV.motion = mo // factories read the mode LIVE; the first phase of morph runs before the post-passes
    if (o.morph !== false && morphAllowed(from, to, modeFlags(mo))) {
      /* Resolving the outgoing slide yields not only targets but also warnings about `morph.ids` paths
       * that are not in the markup. We route them through the same `reportResolve` as the post-pass:
       * otherwise the deck author would learn about a broken path only when the slide becomes INCOMING. */
      var res = e3Resolver.resolveTargets(from, elCanvas)
      reportResolve(from, res.warnings)
      pendingMorph = e3Morph.before({ canvas: elCanvas, slide: from, targets: res.map })
    } else {
      /* leaving a slide without morph must remove the artifacts of the previous, possibly interrupted one:
       * cleanup() is idempotent, on a deck without morph it is a no-op */
      e3Morph.cleanup()
    }
    if (o.defer) return
    render()
  }

  /* ── step navigation ──
   * The branching frame first, then slide lives ONLY in these two wrappers, and all four
   * transition points (both keyboard arrows and both canvas click zones) call them. Repeat this
   * branching in every point — and sooner or later one of them will diverge from the rest:
   * the arrow flips frames, but a click on the edge jumps over them is read by the user as
   * a broken deck, not as different ways of doing one action.
   *
   * The wrappers are deliberately NOT called by jumps: Home/End, a section and a timeline dot, hashchange and
   * programmatic render open the slide from zero (`k = 0`) — that is ensured by `go()` itself
   * via `resetTransient()`. That is why the rule back = previous slide as a whole stands
   * here, and not in `go()`: in `go()` it would turn a backward jump on the timeline into the last
   * frame of the slide instead of the promised first. */
  function stepForward() {
    var total = e3Steps.totalOf(slides[st.idx])
    if (st.step < total) {
      st.step += 1
      /* Entry classes are received by targets that appeared for the first time EXACTLY in this transition — this is decided
       * by the step factory from `stepSeen`, so the reached maximum is raised AFTER
       * the redraw. Raising it earlier means erasing the appearance animation altogether:
       * `enter > seen` will not hold for a single target. */
      render()
      st.stepSeen = st.step
      return
    }
    go(st.idx + 1)
  }
  function stepBack() {
    if (st.step > 0) {
      st.step -= 1
      /* Going back nothing appears for the first time: the maximum is lowered together with the frame BEFORE
       * the redraw, and nobody gets an entry class. */
      st.stepSeen = st.step
      render()
      return
    }
    /* From the first slide there is nowhere to go back — neither a frame nor a slide. The check is mandatory right here:
     * `go(-1)` would exit via the early return (the index after clamp is the same), and the following lines
     * would still open the CURRENT slide on its last frame — a step back would flip forward. */
    if (st.idx === 0) return
    /* Entering a slide backwards must show it WHOLE and without animations, so `stepSeen`
     * is raised together with `step` BEFORE the single redraw. Otherwise (`stepSeen = 0` at
     * `k = total`) all targets of the map would count as appearing for the first time and the slide would greet the
     * viewer with a volley of all its steps at once — and so on every backward return during the show.
     * `defer` — exactly for the sake of one redraw: the state is brought up after the slide change. */
    go(st.idx - 1, { defer: true })
    st.step = e3Steps.totalOf(slides[st.idx])
    st.stepSeen = st.step
    render()
  }

  /* ── presenter notes window: a second browser window ──
   * The presenter shares the deck window AS A WHOLE, so a prompter inside it is useless in any
   * layout. Notes move to a second window, which is not shared; the panel inside the deck
   * REMAINS the default and the fallback path. Analysis of the decisions — engine/README.md, section Notes window.
   *
   * There is NO message channel between windows: about:blank, opened by the deck, stays same-origin
   * with the opener even on file://, so deck → notes is a direct write into a foreign DOM,
   * and notes → deck is a direct call of the step wrappers from a listener that the deck attached
   * into the child document. The link is held by two independent mechanisms: a watchdog <script>
   * in the child document (it survives the death of the deck) and the pagehide of the deck itself.
   *
   * The handle, window key and drawn flag are declared above, next to pendingMorph. */
  var NOTES_START = '/* ── NOTES-WINDOW-CSS-START ── */'
  var NOTES_END = '/* ── NOTES-WINDOW-CSS-END ── */'

  /* Checked BEFORE every draw: a write into a closed window does not throw but silently
   * fails — the presenter would discover that notes are not updating in the middle of a session. */
  function notesAlive() {
    if (!notesWin) return false
    try {
      if (notesWin.closed) { notesWin = null; return false }
    } catch (err) {
      notesWin = null
      return false
    }
    return true
  }

  /* The window name is derived from the deck, not a constant: two decks side by side must not hijack the window
   * from one another. djb2 over the title and screen count — neither Date.now nor random (the export
   * is deterministic), and the name is the same across reloads: adoption relies on it. */
  function deckNotesKey() {
    var s = String(meta.title || '') + '|' + slides.length
    var h = 5381
    for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0
    return 'deckfeatai-notes-' + h.toString(36)
  }
  notesKey = deckNotesKey()
  function notesName() {
    return notesGen ? notesKey + '.' + notesGen : notesKey
  }

  /* The window CSS is cut out of the ASSEMBLED <style> of the deck itself by a pair of markers: not a copy of the rules
   * and not a separate string in the payload. The window shows the same bytes that draw the panel
   * in the deck — editing .deck-pp-* changes the look in both places at once, and the file weight does not grow. */
  function notesCss() {
    var out = ''
    var sheets = document.getElementsByTagName('style')
    for (var i = 0; i < sheets.length; i++) {
      var text = sheets[i].textContent || ''
      var from = 0
      for (;;) {
        var a = text.indexOf(NOTES_START, from)
        if (a < 0) break
        var b = text.indexOf(NOTES_END, a)
        if (b < 0) break
        out += text.slice(a + NOTES_START.length, b)
        from = b + NOTES_END.length
      }
    }
    if (!out) console.warn('Warning: notes window: no NOTES-WINDOW-CSS markers in the deck <style> — window without styling')
    // insurance in case the markers are lost: otherwise the window risks coming up black on black
    return 'html,body{margin:0;padding:0;background:#0d0e11;color:#eceef2;font:15px system-ui,sans-serif}' + out
  }

  /* The watchdog runs in the realm of the CHILD window and answers two questions that the deck cannot
   * ask, because it may no longer exist: whether the opener is alive and whether it is time to call out to the
   * reloaded deck. The __deckLinked flag is set by the deck on draw and cleared on pagehide. */
  function notesGuardSrc() {
    return 'var K=' + JSON.stringify(notesKey) + ';' +
      /* The deck reply to the call-out: it could not adopt the window (see adoptNotes). Staying silent further
       * is not allowed — waiting for the deck would promise what will not happen; we print the action and silence the call-out. */
      'window.addEventListener("message",function(e){' +
      'if(!e.data||!e.data.deckNotesReopen)return;window.__deckLinked=true;' +
      'var el=document.querySelector(".deck-notes-link");if(!el)return;' +
      'el.className="deck-notes-link lost";' +
      'el.textContent="deck reloaded — press Notes in the bottom right corner of the deck"});' +
      'setInterval(function(){' +
      'var o=null;try{o=window.opener}catch(e){o=null}' +
      'var el=document.querySelector(".deck-notes-link");if(!el)return;' +
      'if(!o||o.closed){el.className="deck-notes-link lost";' +
      'el.textContent="link to the deck lost — deck window closed";return}' +
      'if(window.__deckLinked)return;' +
      'el.className="deck-notes-link lost";el.textContent="link to the deck lost — waiting for the deck";' +
      'try{o.postMessage({deckNotesHello:K},"*")}catch(e){}},1000)'
  }

  /* The header and the scroller are created ONCE and survive redraws: the scroller holds
   * the reading position and keyboard focus, and the link row node must be in place by the moment
   * when the deck is gone and there will be nobody to create it. */
  var NOTES_SHELL =
    '<div class="deck-root" data-notes="1" data-layout="bottom" data-mode="brief">' +
    '<div class="deck-notes-head"><span class="deck-notes-no"></span>' +
    '<span class="deck-notes-sec"></span><span class="deck-notes-link"></span></div>' +
    /* The counter is PART OF THE WINDOW SKELETON, not an option: here it is always there (an option can be left off,
     * but the presenter needs a counter, not a setting). The node is created once and survives
     * body redraws: the one-second tick edits two texts in it and must find them without branching. */
    '<div class="deck-notes-clock" data-state="free">' +
    '<span class="deck-notes-clock-v"></span><span class="deck-notes-clock-l"></span></div>' +
    '<div class="deck-notes-scroll" tabindex="0"></div></div>'

  /* Keys and clicks INSIDE the child document; the listeners are attached by the opener, so they
   * close over its functions. The layout repeats the deck: ←/→/PgUp/PgDn flip, ↑/↓/Space
   * and the wheel scroll the notes natively (the scroller is focused — nothing to intercept).
   * The question chip redraws ONLY the window: the panel in the deck is not drawn at all right now. */
  function wireNotes(win) {
    var doc = win.document
    doc.addEventListener('keydown', function (e) {
      var t = e.target
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); stepForward() }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); stepBack() }
    })
    doc.addEventListener('click', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-act="pp-hint"]') : null
      if (!el) return
      var i = el.getAttribute('data-i')
      st.openHint[i] = !st.openHint[i]
      paintNotes(slides[st.idx], secById[slides[st.idx].section], false)
    })
    // the presenter closed the window — the panel, section strip and toggle come back by an EVENT, not
    // on the next arrow press
    win.addEventListener('pagehide', function () {
      notesWin = null
      notesDrawn = ''
      setNotesBtn('closed')
      render()
    })
  }

  /* Assembling the child document via document.open(): it wipes the listeners of the previous
   * document of the window all at once — they cannot be detached one by one. */
  function dressNotes(win) {
    var doc = win.document
    doc.open()
    doc.write('<!doctype html><meta charset="utf-8">')
    doc.close()
    doc.title = (meta.title ? meta.title + ' — ' : '') + 'speaker notes'
    var style = doc.createElement('style')
    style.textContent = notesCss()
    doc.head.appendChild(style)
    doc.body.innerHTML = NOTES_SHELL
    var guard = doc.createElement('script')
    guard.textContent = notesGuardSrc()
    doc.body.appendChild(guard)
    wireNotes(win)
    win.__deckLinked = true
    notesDrawn = ''
  }

  /* Take over the window: assemble the document in it and get the handle. Returns a success flag rather than
   * throwing: the only interesting failure here is they did not let us into its DOM, and it is handled
   * the same way in both call sites. */
  function fillNotes(win) {
    try {
      dressNotes(win)
    } catch (err) {
      console.warn('Warning: notes window: access to its document denied — ' + ((err && err.message) || err))
      return false
    }
    notesWin = win
    return true
  }

  /* Three button states are distinguishable by TEXT, not only by color: browser blocked the window
   * cannot be conveyed by color.
   * The chrome is rebuilt from here too, and this is not a convenience: a button state change is the only
   * moment when the loss of the link is known immediately (it is caught by the handlers of writes into a foreign document,
   * between redraws). Waiting for the nearest redraw would mean keeping the deck window shared —
   * without the row and without the button — exactly when the presenter needs the door to the fallen-off notes. */
  function setNotesBtn(state) {
    if (!elNotesBtn) return
    elNotesBtn.textContent = NOTES_BTN[state] || NOTES_BTN.closed
    elNotesBtn.setAttribute('data-state', state)
    syncChrome(notesAlive())
  }

  /* features is REQUIRED: without it the browser gives a tab, and the presenter needs a window — he
   * cannot put a tab next to the shared deck. A narrow column on the right; the window is not
   * moved to a second monitor (there is no way to tell the browser that), the presenter moves it by hand once. */
  function notesFeatures() {
    var s = window.screen || {}
    var aw = s.availWidth || 1280
    var ah = s.availHeight || 800
    var w = Math.max(420, Math.round(aw * 0.32))
    var h = Math.max(360, ah - 80)
    return 'popup=1,width=' + w + ',height=' + h +
      ',left=' + ((s.availLeft || 0) + aw - w - 20) + ',top=' + ((s.availTop || 0) + 40)
  }

  /* Opening hangs on the BUTTON, not on deck load: without a user gesture the blocker
   * cuts window.open. A repeated click raises the live window to the top — the button is not a toggle,
   * the window is closed by the window itself. */
  function openNotesWindow() {
    if (notesAlive()) {
      try { notesWin.focus() } catch (err) {}
      return
    }
    var win = null
    try { win = window.open('', notesName(), notesFeatures()) } catch (err) { win = null }
    // null — we must not stay silent: the click would look like nothing happened
    if (!win) { setNotesBtn('blocked'); return }
    if (!fillNotes(win)) {
      /* MEASURED, not assumed. A window with this name is left over from the PREVIOUS document of the deck
       * (it was reloaded): on file:// each document gets ITS OWN opaque origin,
       * the child about:blank inherited the origin of the previous document — and to the new one we are foreign,
       * `win.document` throws SecurityError. `window.open` with an empty URL does NOT reload an existing
       * context, so a single retry does not help: the foreign window
       * is closed (`close()` — one of the few properties available across the origin boundary)
       * and a NEW one is opened, under the next name. The second open runs inside the SAME
       * user gesture, so the blocker does not cut it. */
      try { win.close() } catch (err) {}
      notesGen += 1
      win = null
      try { win = window.open('', notesName(), notesFeatures()) } catch (err) { win = null }
      if (!win) { setNotesBtn('blocked'); return }
      if (!fillNotes(win)) { setNotesBtn('denied'); return }
    }
    setNotesBtn('open')
    // one redraw of the deck closes everything at once: panel, section strip, toggle and notes
    render()
    try { win.document.querySelector('.deck-notes-scroll').focus() } catch (err) {}
    try { window.focus() } catch (err) {}
  }

  /* Call-out of an orphaned window: the deck reloaded, its reference to the window disappeared, and the window
   * has a live opener — the watchdog calls out to the deck itself. The key cuts off a neighbouring deck (it is the BASE one, without
   * the sequential suffix of the window name); the real protection is the same-origin access itself: to a foreign
   * window we will not write anything anyway.
   *
   * WHAT IS MEASURED HERE. Automatically adopting an orphaned window on file:// is IMPOSSIBLE, and this is
   * not our shortcoming: a reloaded deck is a new opaque origin, while the window stayed
   * with the old one, and `src.document` throws SecurityError. The call-out does get through (postMessage
   * crosses the origin boundary), so the only sensible action is to tell the presenter
   * what to do: the window prints a hint by its own watchdog, and recovery is done by the button
   * (see openNotesWindow — it closes the stuck window and opens a new one). */
  function adoptNotes(key, src) {
    if (MODE !== 'speaker' || !src || key !== notesKey || notesAlive()) return
    if (fillNotes(src)) {
      setNotesBtn('open')
      render()
      return
    }
    try { src.postMessage({ deckNotesReopen: 1 }, '*') } catch (err) {}
  }

  function notesHintSig() {
    var out = []
    for (var k in st.openHint) if (own(st.openHint, k) && st.openHint[k]) out.push(k)
    return out.sort().join(',')
  }

  /* There is ONE send point — the end of render(), which is passed through by arrows, click zones, jumps
   * on the timeline, hashchange and programmatic render.
   * The body is redrawn ONLY on a screen change (or chip expansion), on a frame change
   * one counter node is edited: otherwise a presenter who scrolled a long script would lose their place
   * on every frame. For the same reason the scroller position is taken and restored around
   * innerHTML when the screen did not change. */
  function paintNotes(s, sec, capturing) {
    // capture mode — video and state walk by the scanner: without the gate a single clip would give hundreds
    // of window redraws, and the scanner would open it on every run
    if (capturing || !notesAlive()) return
    try {
      var doc = notesWin.document
      var scroll = doc.querySelector('.deck-notes-scroll')
      if (!scroll) return
      notesWin.__deckLinked = true
      var total = e3Steps.totalOf(s)
      var frame = total > 0 ? 'frame ' + st.step + ' of ' + total : ''
      var key = st.idx + '|' + notesHintSig()
      if (key === notesDrawn) {
        var one = doc.querySelector('.deck-notes-step')
        if (one) one.textContent = frame
        return
      }
      var keepTop = notesDrawn.split('|')[0] === String(st.idx) ? scroll.scrollTop : 0
      var next = slides[st.idx + 1]
      // a screen without notes is not an empty window: the frame is in place, the emptiness is covered by an explicit line
      var body = s.prompter && cueChips(s.prompter).length > 0
        ? prompterHtml(s.prompter, { bar: false })
        : '<div class="deck-notes-none">No notes for this screen.</div>'
      scroll.innerHTML =
        '<div class="deck-notes-title">' + esc(screenTitle(s)) + '</div>' +
        '<div class="deck-notes-step">' + esc(frame) + '</div>' + body +
        '<div class="deck-notes-next">' +
        (next ? 'next: ' + esc(screenTitle(next)) : 'this is the last screen') + '</div>'
      scroll.scrollTop = keepTop
      notesDrawn = key
      doc.querySelector('.deck-notes-no').textContent = (st.idx + 1) + ' / ' + slides.length
      doc.querySelector('.deck-notes-sec').textContent = sec
        ? sec.title + (sec.timing ? ' · ' + sec.timing : '')
        : ''
      var link = doc.querySelector('.deck-notes-link')
      link.className = 'deck-notes-link'
      link.textContent = 'deck connected'
    } catch (err) {
      notesWin = null
      notesDrawn = ''
      setNotesBtn('denied')
      console.warn('Warning: notes window: write to its document failed — ' + ((err && err.message) || err))
    }
  }

  /* The second badge mechanism, independent of the watchdog: the deck leaves and says so itself.
   * The watchdog duplicates it for the case when pagehide did not happen. */
  window.addEventListener('pagehide', function () {
    if (!notesAlive()) return
    try {
      notesWin.__deckLinked = false
      var el = notesWin.document.querySelector('.deck-notes-link')
      if (el) {
        el.className = 'deck-notes-link lost'
        el.textContent = 'link to the deck lost — deck window closed'
      }
    } catch (err) {}
  })

  /* ── section time counter ────────────────────────────────────────────────────────────
   * How much time is left on the current ITEM. The unit is a section (time is declared on sections, slides
   * do not have it); minutes arrive as the number `planMin` — the `timing` string was parsed by the exporter with the shared
   * module, the same one that computes the timing. Analysis of the decisions — engine/README.md, Section
   * time counter; the same place has what the code lacks.
   * Accounting and format functions are PURE, the clock comes as the `now` argument: otherwise returning to
   * a completed section continues its count would be checked by waiting in a browser, not by a number. */

  /* The section of the CURRENT screen — one form for all accounting points (redraw and frame
   * capture release). If they diverged, the clock would point to one section while the plan and label were taken
   * from another — the counter would print a confident wrong number. A screen without a section gives an empty
   * key: the bucket for all such screens is ONE, and the label says exactly that. */
  function curSection() {
    var s = slides[st.idx]
    return String(s && s.section != null ? s.section : '')
  }
  // a copy of the spent map with the interval of the current section closed; `Math.max(0, …)` — the clock is
  // wall-clock and can go backwards (NTP, waking from sleep), a minus would give away nonexistent minutes
  function clockAdd(acc, now) {
    var out = {}
    for (var k in acc.spent) if (own(acc.spent, k)) out[k] = acc.spent[k]
    if (acc.id != null) out[acc.id] = (out[acc.id] || 0) + Math.max(0, now - acc.since)
    return out
  }
  /* Section entry accounting, one call per redraw, returns the NEW clock state.
   *   · same section — touch nothing (hundreds of redraws per presentation);
   *   · a different one — close the interval of the previous. The accumulated past visits REMAIN: returning
   *     to a completed screen continues the count, otherwise the counter understates the time spent — silently;
   *   · frame capture — freeze: the scanner and frame-by-frame render run hundreds of states, and their
   *     time would eat the budget. Unfreezing sets the mark anew — the run goes to nobody. */
  function clockStep(acc, id, now, capturing) {
    if (capturing) {
      return acc.held ? acc : { id: acc.id, since: now, held: true, spent: clockAdd(acc, now) }
    }
    if (acc.held) return { id: id, since: now, held: false, spent: acc.spent }
    if (id === acc.id) return acc
    return { id: id, since: now, held: false, spent: clockAdd(acc, now) }
  }
  // spent in the CURRENT section: past visits plus the running interval (for frozen ones the interval
  // is already closed into the map, so only the past ones)
  function clockSpent(acc, now) {

    return (acc.spent[acc.id] || 0) + (acc.held ? 0 : Math.max(0, now - acc.since))

  }

   * from 5:01. Rounding DOWN — the counter does not overstate the remainder. The sign is stripped: it is printed by
   * the label as a word, a minus before digits is not read in the flow of speech. */
  function clockMs(ms) {

  }

   * where a section is three seconds long, that is, the label would lie about the plan it itself names. */

    return String(Math.round(m * 10) / 10).replace('.', ',') + ' min'
  }

   * screen section was found, `loose` — whether the reading of its time is uncertain (`planLoose`).
   * Three outcomes instead of two:
   *   · there is a budget — countdown, after zero overrun;
   *   · no budget — direct count from entry, and it is labeled (a silent absence of the counter
   *     would be read as a breakage);
   *   · budget read uncertainly — the countdown RUNS, but does not pretend to be exact: the ≈ sign before
   *     the digits, words in the label and the `loose` flag for CSS. Throwing away a probably correct number
   *     for the sake of a direct count would be worse than showing it with a caveat. */
  function clockRead(spent, plan, known, loose) {
    var value = clockMs(spent)
    // the bucket for ALL screens outside a section is one (the key is an empty string), so the label does not
    // promise a count for a single screen: two orphan screens are counted together, and returning
    // to the first continues the shared count
    if (!known) return { state: 'free', value: value, short: 'no section', loose: false, label: 'screen outside a section — shared count of such screens' }
    if (!(typeof plan === 'number' && isFinite(plan) && plan > 0)) {

    var mark = soft ? '≈' : ''

    var sec = s && own(secById, s.section) ? secById[s.section] : null
    var r = clockRead(clockSpent(clock, Date.now()), sec ? sec.planMin : null, !!sec, sec ? sec.planLoose : false)

    if (want && !clockTick) {

    else if (e.code === 'KeyP' && MODE === 'speaker' && LAYOUT === 'overlay' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); st.detail = !st.detail; render() }

   * A foreign redraw during input pulls focus out of the field, so it is suppressed — but
   * STRICTLY by two flags at once, otherwise the rule would block the work of the island itself:
   * after a click on a button the active element is already BUTTON, and a naive focus inside the island rule would suppress
   * tab switching — the island would look broken at the moment of its main action.
   *   1) focus in a FREE INPUT field of the island (the same logic as in the keydown guard of the core);
   *   2) the action is EXTERNAL: another island key, or no key at all (navigation, presenter
   *      toggle, qa tabs).
   * The typing-in-progress-right-now flag is REMEMBERED on focusin, not read at click time:
   * the event order is mousedown → field blur → click, so by the time the delegate runs, focus is already outside. */

   * condition for the rule to work: on a mouse click the events fire in the order
   * mousedown → focusout → mouseup → click, so a synchronous clear would reset the flag
   * BEFORE the delegate runs and the suppression branch would never fire (verified with a real
   * mouse click, not a programmatic `el.click()`: that does not move focus and hides the defect).
   * The timer is cancelled by an incoming `focusin`, so a move between two fields of the same
   * island does not fire the queue. */

    }
  }

    var t = e.target
    var host = isFreeInput(t) && t.closest ? t.closest('[data-island]') : null
    /* Focus left for something that is NOT a free-text field (typically an action button, and every action in the deck
     * is printed as a button): the flag is not cleared here, because `focusin` also arrives BEFORE `click`,
     * and clearing it would bring back the same unreachable suppression branch. The deferred timer clears it,
     * after the delegate. Cancelling the timer only makes sense on a move to ANOTHER
     * free-text field of the island, and that is why it was introduced. */
    if (!host) return

  var LEAVE_ACTS = { prev: 1, next: 1, 'go-sec': 1, 'go-slide': 1 }

     * the wrapper would do nothing anyway (the first slide on frame zero is the back zone,
     * the last slide on the last frame is the forward zone). */
    if (act === 'prev') return stepBack()

    if (act === 'clock') { clockOn = !clockOn; clockPaint(false); return clockSync(false) }

  function mergeIsland(key, patch) {

   *   · the slide change is gated by index HERE, rather than relying on the early exit of `go()`: that one

  BOOT.render = function (state) {

      one[key][field] = true
      var short = key.indexOf(prefix) === 0 && prefix !== ':' ? key.slice(prefix.length) : key
      out.push({ id: no + '.' + short + ':' + field, label: 'expanded ' + field + ' on ' + short, step: 0, islands: one })
      if (!own(worst, key)) { worst[key] = {}; worstKeys += 1 }
      worst[key][field] = true
    }
    if (worstKeys) out.push({ id: no + '.all-open', label: 'worst case, everything expanded', step: 0, islands: worst })
    return out
  }

  /* Who is entitled to control the show. The video driver loads the deck in an iframe and sends commands
   * from ABOVE (`window.parent`), the page itself sends to itself (`window`); the opener window is added by the same
   * right. Everything else is CHILD frames, that is, the sandbox of a widget guest: without this
   * check, code inside a widget embedded in the deck could page the deck, set a frame and REPLACE
   * the whole island state map. This did not raise privileges (the widget author would be moving
   * their own deck), but a guest channel must not be a channel for controlling the show.
   * `window.parent === window` when the deck is not opened in an iframe, so the check converges on its own. */
  function trustedSource(src) {
    if (!src) return false
    return src === window || src === window.parent || src === window.opener
  }
  /* The rejection is printed ONCE: a foreign frame may send commands frame by frame, and the log would turn
   * into a wall. Staying silent is not an option at all, otherwise a driver sending from an unexpected context
   * would look like a hung deck with no reason in the console. */
  var refusedSource = false

  /* Receiving render commands from outside (Remotion sends them frame by frame) + an ack by seq AFTER applying and
   * document.fonts.ready, otherwise the frame is captured with half-rendered text. No timers. */
  window.addEventListener('message', function (e) {
    var d = e.data
    if (!d) return
    /* Hailing an orphaned notes window. It does NOT go through `trustedSource` and cannot:
     * that function answers the question of who is entitled to control the show and knows the parent,
     * itself and the opener, while the notes window is not a parent of the deck but a child. The right of adoption
     * is checked in its own way, see adoptNotes. */
    if (d.deckNotesHello) return adoptNotes(d.deckNotesHello, e.source)
    if (!d.deckRender) return
    if (!trustedSource(e.source)) {
      if (!refusedSource) {
        refusedSource = true
        console.warn('Warning: deckRender command came from neither the parent window nor the page itself, ignored')
      }
      return
    }
    BOOT.render(d.deckRender)
    document.fonts.ready.then(function () {
      if (e.source) e.source.postMessage({ deckAck: true, seq: d.seq }, '*')
    })
  })

  render()
})();</script>
</body>
</html>
